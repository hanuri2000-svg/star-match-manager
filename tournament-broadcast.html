<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>토너먼트 방송화면</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07080d;color:#fff;font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}
.board{--accent:#a970ff;--soft:rgba(169,112,255,.18);--line:rgba(185,145,255,.5);position:relative;width:100vw;aspect-ratio:16/9;overflow:hidden;background:radial-gradient(circle at 50% 50%,var(--soft),transparent 26%),linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px),linear-gradient(180deg,#121521,#080a10 58%,#05060a);background-size:auto,48px 48px,48px 48px,auto}
.board[data-theme="blue"]{--accent:#4ea5ff;--soft:rgba(78,165,255,.18);--line:rgba(107,186,255,.5)}.board[data-theme="red"]{--accent:#ff6178;--soft:rgba(255,97,120,.17);--line:rgba(255,126,145,.5)}.board[data-theme="gold"]{--accent:#e7bb62;--soft:rgba(231,187,98,.17);--line:rgba(241,202,126,.5)}.board[data-theme="green"]{--accent:#48cb8b;--soft:rgba(72,203,139,.17);--line:rgba(102,222,163,.5)}
.brand{position:absolute;z-index:8;top:2.4%;left:50%;transform:translateX(-50%);font-size:clamp(8px,.75vw,12px);font-weight:1000;letter-spacing:.28em;color:var(--accent);white-space:nowrap}.title{position:absolute;z-index:8;top:5.2%;left:50%;transform:translateX(-50%);width:70%;text-align:center;font-size:clamp(22px,2.2vw,40px);font-weight:1000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.subtitle{position:absolute;z-index:8;top:11%;left:50%;transform:translateX(-50%);width:70%;text-align:center;font-size:clamp(9px,.9vw,15px);font-weight:800;color:#9fa8ba;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.round{position:absolute;z-index:7;top:18.2%;transform:translateX(-50%);padding:5px 13px;border:1px solid var(--line);border-radius:999px;background:rgba(10,12,18,.82);color:#dfe4ee;font-size:clamp(9px,.9vw,14px);font-weight:1000}.final{position:absolute;z-index:7;top:18%;left:50%;transform:translateX(-50%);color:var(--accent);font-size:clamp(12px,1.15vw,19px);font-weight:1000;letter-spacing:.18em}.champ-label{position:absolute;z-index:7;left:50%;top:52.2%;transform:translateX(-50%);color:#7f899c;font-size:clamp(8px,.72vw,12px);font-weight:1000;letter-spacing:.14em}.third-label{position:absolute;z-index:7;left:50%;top:77%;transform:translateX(-50%);color:#aab2c0;font-size:clamp(9px,.9vw,14px);font-weight:1000}
.lines{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}.lines path{fill:none;stroke:var(--line);stroke-width:3}.slot{position:absolute;z-index:10;display:flex;align-items:center;justify-content:center;padding:0 .35%;border:1px solid rgba(255,255,255,.14);border-radius:7px;background:rgba(13,16,24,.88);box-shadow:inset 3px 0 0 var(--accent);color:#f5f7fb;font-weight:950;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:clamp(9px,1.05vw,17px)}.slot:empty{opacity:.34}.slot.champ{border-color:var(--line);background:linear-gradient(180deg,var(--soft),rgba(14,16,23,.95));box-shadow:0 0 24px var(--soft),inset 0 0 0 1px var(--line)}.third-win{color:#ffe6a3!important;border-color:#e7bb62!important;box-shadow:inset 3px 0 0 #e7bb62!important}.third-lose{opacity:.28}
.progress{position:absolute;z-index:11;right:2.2%;top:3%;min-width:150px;height:34px;padding:0 12px;border:1px solid rgba(255,255,255,.14);border-radius:999px;background:rgba(8,10,15,.78);display:flex;align-items:center;justify-content:center;font-weight:950;font-size:clamp(9px,.82vw,13px)}.version{position:absolute;z-index:12;left:1.3%;bottom:1.2%;color:#778092;font-size:clamp(8px,.75vw,12px)}
.overlay{position:fixed;inset:0;z-index:120;display:none;align-items:center;justify-content:center;background:#08060c}.overlay.show{display:flex}.card{width:min(520px,92vw);padding:24px;border:1px solid #5d466f;border-radius:18px;background:#15101f;text-align:center}.card h2{margin:0 0 10px}.card p{margin:0;color:#aaa0b2;line-height:1.55}
.podium{position:absolute;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(4,3,8,.78);backdrop-filter:blur(3px)}.podium.show{display:flex}.podium-wrap{position:relative;width:64%;min-width:620px;padding:3%;border:1px solid var(--line);border-radius:22px;background:linear-gradient(180deg,rgba(36,27,50,.98),rgba(14,11,21,.98));text-align:center}.podium-title{font-size:clamp(16px,1.6vw,24px);font-weight:1000;margin-bottom:2.2%}.podium-grid{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:2%;align-items:end}.podium-card{min-height:130px;border-radius:16px;padding:18px 12px;background:#15101f;display:flex;flex-direction:column;align-items:center;justify-content:center}.podium-card.first{min-height:175px;border:2px solid #e3bd64}.podium-card.second{border:2px solid #c2c6d2}.podium-card.third{border:2px solid #bc7a54}.rank{font-size:clamp(18px,2vw,28px);font-weight:1000;margin:8px 0}.team{font-size:clamp(15px,1.8vw,28px);font-weight:1000}.close{position:absolute;right:14px;top:12px;width:38px;height:38px;border:1px solid #5a4b65;border-radius:50%;background:#211829;color:#fff;font-size:22px;font-weight:900;cursor:pointer}
</style>
</head>
<body>
<div class="overlay" id="noRoom"><div class="card"><h2>토너먼트 방송화면</h2><p>도랑이꺼야의 <b>토너먼트</b> 탭에서<br><b>송출컴 방송링크 복사</b>를 눌러 열린 주소를 사용해.</p></div></div>
<div class="board" id="board" data-theme="purple">
  <div class="brand" id="brand">TOURNAMENT</div><div class="title" id="title">토너먼트 대진표</div><div class="subtitle" id="subtitle">16강 토너먼트</div>
  <div class="round" style="left:10%">16강</div><div class="round" style="left:28%">8강</div><div class="round" style="left:40%">4강</div><div class="final">FINAL</div><div class="round" style="left:60%">4강</div><div class="round" style="left:72%">8강</div><div class="round" style="left:90%">16강</div><div class="champ-label">CHAMPION</div><div class="third-label">3 · 4위전</div>
  <svg class="lines" viewBox="0 0 1536 864" aria-hidden="true">
    <path d="M240 283 H274 V315 H304"/><path d="M240 341 H274 V315 H304"/><path d="M240 401 H274 V431 H304"/><path d="M240 459 H274 V431 H304"/><path d="M240 522 H274 V554 H304"/><path d="M240 581 H274 V554 H304"/><path d="M240 642 H274 V674 H304"/><path d="M240 700 H274 V674 H304"/>
    <path d="M395 315 H430 V375 H462"/><path d="M395 431 H430 V375 H304"/><path d="M395 554 H430 V612 H462"/><path d="M395 674 H430 V612 H462"/><path d="M558 375 H600 V476 H520"/><path d="M558 612 H600 V476 H520"/><path d="M610 476 H680 V508"/>
    <path d="M1303 283 H1262 V315 H1229"/><path d="M1303 341 H1262 V315 H1229"/><path d="M1303 401 H1262 V431 H1229"/><path d="M1303 459 H1262 V431 H1229"/><path d="M1303 522 H1262 V554 H1229"/><path d="M1303 581 H1262 V554 H1229"/><path d="M1303 642 H1262 V674 H1229"/><path d="M1303 700 H1262 V674 H1229"/>
    <path d="M1138 315 H1105 V375 H1073"/><path d="M1138 431 H1105 V375 H1073"/><path d="M1138 554 H1105 V612 H1073"/><path d="M1138 674 H1105 V612 H1073"/><path d="M977 375 H936 V476 H1016"/><path d="M977 612 H936 V476 H1016"/><path d="M926 476 H856 V508"/>
  </svg>
  <div class="progress" id="progress">16강 결과 0 / 8</div><div class="version">DORANG TOURNAMENT · v5.22.0</div>
  <div class="podium" id="podium"><div class="podium-wrap"><button class="close" id="closePodium">×</button><div class="podium-title" id="podiumTitle">최종 순위</div><div class="podium-grid"><div class="podium-card second"><div class="rank">2위</div><div class="team" id="p2">-</div></div><div class="podium-card first"><div style="font-size:40px;color:#f1c96e">♛</div><div class="rank">1위</div><div class="team" id="p1">-</div></div><div class="podium-card third"><div class="rank">3위</div><div class="team" id="p3">-</div></div></div></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script src="./tournament-core.js?v=5.22.0"></script>
<script>
const C=window.DorangTournamentCore,KEY="star-match-manager-v1",room=C.roomFromUrl(),board=document.getElementById("board"),els={},noRoom=document.getElementById("noRoom");let state=C.blank(),lastSig="";
for(const id of Object.keys(C.SLOT_POSITIONS)){const d=document.createElement("div");d.className="slot"+(id==="CHAMP"?" champ":"");d.style.cssText=C.positionStyle(id);board.appendChild(d);els[id]=d}
function render(){
  const e=state.event||C.blank().event;board.dataset.theme=e.theme||"purple";document.getElementById("brand").textContent=e.brand||"";document.getElementById("title").textContent=e.title||"토너먼트 대진표";document.getElementById("subtitle").textContent=e.subtitle||"";document.title=(e.title||"토너먼트")+" 방송화면";
  for(const id of Object.keys(C.SLOT_POSITIONS)){els[id].className="slot"+(id==="CHAMP"?" champ":"");els[id].textContent=C.slotTeam(state,id)}
  const third=C.matchup(state,"THIRD");els.TL.textContent=state.started?(third[0]||""):"";els.TR.textContent=state.started?(third[1]||""):"";
  if(state.started&&state.results.THIRD){if(third[0]===state.results.THIRD){els.TL.textContent="3위 · "+third[0];els.TL.classList.add("third-win");els.TR.classList.add("third-lose")}else if(third[1]===state.results.THIRD){els.TR.textContent="3위 · "+third[1];els.TR.classList.add("third-win");els.TL.classList.add("third-lose")}}
  els.CHAMP.textContent=state.started?(state.results.FINAL||""):"";
  const n=Object.keys(state.results).filter(k=>k.startsWith("L16_")||k.startsWith("R16_")).length;document.getElementById("progress").textContent="16강 결과 "+n+" / 8";
  const r=C.rankings(state),sig=r.complete?(r.first+"|"+r.third):"";if(r.complete&&sig!==lastSig){lastSig=sig;document.getElementById("p1").textContent=r.first;document.getElementById("p2").textContent=r.second;document.getElementById("p3").textContent=r.third;document.getElementById("podiumTitle").textContent=(e.title||"토너먼트")+" · 최종 순위";document.getElementById("podium").classList.add("show")}if(!r.complete){lastSig="";document.getElementById("podium").classList.remove("show")}
}
document.getElementById("closePodium").onclick=()=>document.getElementById("podium").classList.remove("show");document.getElementById("podium").onclick=e=>{if(e.target.id==="podium")e.currentTarget.classList.remove("show")};
function loadLocal(){try{const app=JSON.parse(localStorage.getItem(KEY)||"null");if(app?.tournament)state=C.normalize(app.tournament)}catch{}render()}
if(!room){noRoom.classList.add("show");loadLocal()}else if(typeof Peer==="undefined"){loadLocal()}else{
  const peer=new Peer(),connect=()=>{const conn=peer.connect(C.peerPrefix+room,{reliable:true});conn.on("data",msg=>{if(msg?.type==="state"){state=C.normalize(msg.state);render()}});conn.on("close",()=>setTimeout(connect,2000));conn.on("error",()=>setTimeout(connect,2000))};peer.on("open",connect);peer.on("error",()=>setTimeout(connect,2000));
}
window.addEventListener("storage",e=>{if(e.key===KEY)loadLocal()});render();
</script>
</body>
</html>
