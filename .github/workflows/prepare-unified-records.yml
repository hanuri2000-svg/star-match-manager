name: Prepare unified record list
on:
  push:
    branches: ['fix/unified-record-list-20261117']
    paths: ['.github/workflows/prepare-unified-records.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright/python:v1.56.0-noble
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply reviewed application changes
        run: |
          python scripts/apply-unified-records.py
          echo 'cf159912f76ca0d291696d107fa4c6120710a0a844fa4c8f2b1d35ba24db8221  starlog/app.js' | sha256sum -c -
          echo 'd45c16fcc1d7285482a2d803a673ff24901bd14cb4ea29cb02324dfa0184cae3  tests/starlog-record-sources.test.mjs' | sha256sum -c -
      - name: Check all JavaScript and browser regressions
        run: |
          node --check starlog/app.js
          node --test tests/*.test.mjs
          python -m pip install playwright==1.56.0
          python tests/elo-public-smoke.py
      - name: Save checked source and screenshots
        if: always()
        run: |
          mkdir -p checked-output
          tar -czf checked-output/source.tgz --exclude=.git --exclude=checked-output --exclude=test-results .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-records-checks
          path: |
            checked-output/source.tgz
            test-results/elo-public-smoke/
          retention-days: 3
      - name: Commit tested application files only
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add starlog/app.js starlog/index.html starlog/sw.js starlog/version.json starlog-embed.js index.html version.json tests/starlog-record-sources.test.mjs tests/elo-public-smoke.py
          git rm scripts/apply-unified-records.py
          git commit -m 'Unify linked and local matches in the existing record list'
          git push origin HEAD:refs/heads/fix/unified-record-list-20261117
