name: Apply reviewed refresh update
on:
  push:
    branches: ['fix/six-hour-manual-refresh-20261117']
    paths: ['.github/workflows/apply-refresh-update.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright/python:v1.56.0-noble
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply reviewed client and schedule changes
        run: python .maintenance/apply-client-refresh.py
      - name: Verify application and browser behavior
        run: |
          node --test tests/*.test.mjs
          python -m pip install playwright==1.56.0
          python tests/elo-public-smoke.py
          python tests/schedule-play-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: six-hour-refresh-browser-checks
          path: |
            test-results/elo-public-smoke/
            test-results/schedule-play-smoke/
          retention-days: 7
      - name: Commit tested application files only
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html version.json schedule-play-records.js starlog tests
          git commit -m 'Use six-hour refresh and immediate manual updates in statistics and schedule'
          git push origin HEAD:refs/heads/fix/six-hour-manual-refresh-20261117
