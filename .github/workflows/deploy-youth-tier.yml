name: Deploy and verify shared youth tier additions
on:
  push:
    branches: ['ops/youth-tier-release-20261117']
    paths: ['.github/workflows/deploy-youth-tier.yml']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: read
      actions: write
      pages: read
    steps:
      - name: Verify approved PR and dispatch existing exact-SHA production gate
        uses: actions/github-script@v7
        with:
          script: |
            const expected = 'b9373dd4773e2b3ea990ada95e9077491bce8319';
            const {data:pr} = await github.rest.pulls.get({...context.repo,pull_number:39});
            if (!pr.merged || pr.head.sha !== '6643389dc85805eba5a57664da2d23dc30463281' || pr.merge_commit_sha !== expected) throw new Error('Approved PR changed');
            const {data:main} = await github.rest.git.getRef({...context.repo,ref:'heads/main'});
            if (main.object.sha !== expected) throw new Error('Main changed; review before deployment');
            await github.rest.actions.createWorkflowDispatch({...context.repo,workflow_id:'regression-tests.yml',ref:'main',inputs:{tested_sha:expected,deploy_sha:expected}});
            core.info('Requested existing guarded deployment for '+expected);
      - name: Verify deployment success and exact published shared files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,time,hashlib,urllib.request
          from pathlib import Path
          sha='b9373dd4773e2b3ea990ada95e9077491bce8319'
          repo='hanuri2000-svg/star-match-manager'
          def api(path):
              req=urllib.request.Request('https://api.github.com/repos/'+repo+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req,timeout=30) as response:return json.load(response)
          deadline=time.time()+900
          run=None
          while time.time()<deadline:
              runs=api('/actions/workflows/regression-tests.yml/runs?branch=main&event=workflow_dispatch&head_sha='+sha+'&per_page=20')['workflow_runs']
              matching=[r for r in runs if r['head_sha']==sha and r['event']=='workflow_dispatch']
              if matching:
                  run=max(matching,key=lambda r:r['id'])
                  if run['status']=='completed':
                      assert run['conclusion']=='success',run['html_url']+' '+str(run['conclusion'])
                      jobs=api('/actions/runs/'+str(run['id'])+'/jobs')['jobs']
                      outcomes={j['name']:j['conclusion'] for j in jobs}
                      assert all(outcomes.get(n)=='success' for n in ['test','browser-smoke','build-pages','deploy-pages']),outcomes
                      break
              time.sleep(12)
          else:raise RuntimeError('Guarded deployment not confirmed')
          expected={'players.json':'413c315e08b5054efac9652014d48cc26d00ca97bdeba80cd288b40c76a86247','tier-board.js':'2e527058ced0a942d3111c1eda64b2b2f284edf379f0399a1f1d3ccaed140dec'}
          base='https://hanuri2000-svg.github.io/star-match-manager/'
          def public(path):
              req=urllib.request.Request(base+path+'?verify='+sha,headers={'Cache-Control':'no-cache','User-Agent':'shared-youth-tier-release-check'})
              with urllib.request.urlopen(req,timeout=30) as response:return response.read()
          for attempt in range(15):
              try:
                  assert json.loads(public('deployment.json'))['sha']==sha
                  for name,digest in expected.items():assert hashlib.sha256(public(name)).hexdigest()==digest,name
                  break
              except Exception:
                  if attempt==14:raise
                  time.sleep(10)
          result={'deployed':True,'sha':sha,'productionRun':run['html_url'],'files':expected,'newPlayers':['수빛나','김아린']}
          Path('release-result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          print(json.dumps(result,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: youth-tier-release-result
          path: release-result.json
          retention-days: 7
  production-ui:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container: mcr.microsoft.com/playwright/python:v1.56.0-noble
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install browser tooling
        run: python -m pip install playwright==1.56.0
      - name: Verify the two players on all three production tier tables
        run: python .deploy-youth-tier-ui.py
      - name: Save production tier verification and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youth-tier-three-sites-ui
          path: test-results/youth-production/
          retention-days: 7
