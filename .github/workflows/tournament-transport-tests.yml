name: Tournament transport regressions
on:
  pull_request:
    paths:
      - 'tournament-*.js'
      - 'tournament-broadcast.html'
      - 'index.html'
      - 'tests/tournament-transport.test.mjs'
      - '.github/workflows/tournament-transport-tests.yml'
  push:
    branches: [main]
    paths:
      - 'tournament-*.js'
      - 'tournament-broadcast.html'
      - 'index.html'
      - 'tests/tournament-transport.test.mjs'
      - '.github/workflows/tournament-transport-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test tests/tournament-transport.test.mjs
