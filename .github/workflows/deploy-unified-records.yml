name: Deploy and verify unified record list
on:
  push:
    branches: ['ops/unified-records-release-20261117']
    paths: ['.github/workflows/deploy-unified-records.yml']
permissions:
  contents: read
  actions: write
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Verify approved PR and request the existing exact-SHA deployment
        id: dispatch
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const expectedHead='42ef06ff714dd13676cc04285c7952427b7dbf2e';
            const pr=(await github.rest.pulls.get({owner,repo,pull_number:38})).data;
            if(!pr.merged || pr.head.sha!==expectedHead) throw new Error('PR is not the reviewed merged change');
            const sha=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;
            if(sha!==pr.merge_commit_sha) throw new Error('Main moved after the reviewed merge');
            const checked=(await github.rest.actions.getWorkflowRun({owner,repo,run_id:43971543443})).data;
            if(checked.head_sha!==expectedHead || checked.conclusion!=='success') throw new Error('Full regression checks have not passed');
            const jobs=(await github.rest.actions.listJobsForWorkflowRun({owner,repo,run_id:43971543443})).data.jobs;
            for(const name of ['test','browser-smoke']) if(!jobs.some(j=>j.name===name&&j.conclusion==='success')) throw new Error('Missing required check '+name);
            core.setOutput('sha',sha);
            core.setOutput('requestedAt',new Date().toISOString());
            await github.rest.actions.createWorkflowDispatch({owner,repo,workflow_id:'regression-tests.yml',ref:'main',inputs:{tested_sha:sha,deploy_sha:sha}});
      - name: Verify production deployment and exact published application
        uses: actions/github-script@v7
        env:
          EXPECTED_SHA: ${{ steps.dispatch.outputs.sha }}
          REQUESTED_AT: ${{ steps.dispatch.outputs.requestedAt }}
        with:
          script: |
            const fs=require('fs'),crypto=require('crypto');
            const {owner,repo}=context.repo,sha=process.env.EXPECTED_SHA;
            const pause=ms=>new Promise(resolve=>setTimeout(resolve,ms));
            let deployment;
            for(let i=0;i<60;i++){
              const runs=(await github.rest.actions.listWorkflowRuns({owner,repo,workflow_id:'regression-tests.yml',branch:'main',event:'workflow_dispatch',per_page:10})).data.workflow_runs;
              const run=runs.find(r=>r.head_sha===sha&&Date.parse(r.created_at)>=Date.parse(process.env.REQUESTED_AT)-10000);
              if(run?.status==='completed'){
                if(run.conclusion!=='success') throw new Error('Production verification failed: '+run.html_url);
                const jobs=(await github.rest.actions.listJobsForWorkflowRun({owner,repo,run_id:run.id})).data.jobs;
                if(!['test','browser-smoke','build-pages','deploy-pages'].every(name=>jobs.some(j=>j.name===name&&j.conclusion==='success'))) throw new Error('Production deployment incomplete');
                deployment=run;break;
              }
              await pause(10000);
            }
            if(!deployment) throw new Error('Exact-SHA deployment has not completed');
            const base='https://hanuri2000-svg.github.io/star-match-manager/';
            const expectedHash='cf159912f76ca0d291696d107fa4c6120710a0a844fa4c8f2b1d35ba24db8221';
            let verified,lastError;
            for(let i=0;i<12;i++){
              try{
                const read=async path=>{const response=await fetch(base+path+'?verify='+sha+'-'+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(15000)});if(!response.ok)throw new Error(path+': '+response.status);return response.text()};
                const marker=JSON.parse(await read('deployment.json'));
                const version=JSON.parse(await read('version.json'));
                const app=await read('starlog/app.js');
                const hash=crypto.createHash('sha256').update(app).digest('hex');
                const embed=await read('starlog-embed.js');
                if(marker.sha!==sha||version.version!=='5.24.33'||hash!==expectedHash||!embed.includes('2.0.22'))throw new Error('Published assets are not the reviewed release yet');
                if(app.includes('data-record-source')||app.includes('recordSource')||!app.includes('function unifiedTable(rows)'))throw new Error('Unified record list validation failed');
                verified={sha,version:version.version,embeddedVersion:'2.0.22',appSha256:hash,deploymentRun:deployment.id,deploymentUrl:deployment.html_url,verifiedAt:new Date().toISOString(),checks:['required Node and browser checks','production deploy','exact published application hash','source selector removed','single unified record list']};
                break;
              }catch(error){lastError=String(error);await pause(5000)}
            }
            if(!verified)throw new Error(lastError||'Published asset verification failed');
            fs.writeFileSync('verification.json',JSON.stringify(verified,null,2));
            core.info(JSON.stringify(verified));
            await core.summary.addHeading('Verified production release').addCodeBlock(JSON.stringify(verified,null,2),'json').write();
      - uses: actions/upload-artifact@v4
        with:
          name: unified-records-production-verification
          path: verification.json
          retention-days: 7
