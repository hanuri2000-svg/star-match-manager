name: Scope browser reload assertion
on:
  push:
    branches: ['fix/six-hour-manual-refresh-20261117']
    paths: ['.github/workflows/scope-reload-check.yml']
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Assert one additional request per reload, not one across prior scoreboard reloads
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/browser-smoke.py');s=p.read_text()
          marker='        await page.reload(wait_until="networkidle")\n        await asyncio.wait_for(reload_requested.wait(), timeout=15)'
          assert s.count(marker)==1
          s=s.replace(marker,'''        # The scoreboard persistence checks above intentionally reload twice.
                  # Measure this navigation separately while retaining those checks.
                  forced_before = requested_urls.count(recent_url + "&refresh=1")
                  normal_before = requested_urls.count(recent_url)
                  reload_requested.clear()
                  await page.reload(wait_until="networkidle")
                  await asyncio.wait_for(reload_requested.wait(), timeout=15)'''.replace('\n                  ', '\n        '),1)
          old='assert requested_urls.count(recent_url + "&refresh=1") == 1, "browser reload must request fresh schedule data exactly once"'
          new='assert requested_urls.count(recent_url + "&refresh=1") == forced_before + 1, {"message": "one additional fresh request per reload", "before": forced_before, "after": requested_urls.count(recent_url + "&refresh=1"), "requests": requested_urls}'
          assert old in s;s=s.replace(old,new,1)
          old='assert requested_urls.count(recent_url) == 1, "reload must not repeat a normal cached request"'
          new='assert requested_urls.count(recent_url) == normal_before, "reload must not repeat a normal cached request"'
          assert old in s;s=s.replace(old,new,1)
          p.write_text(s)
          PY
          python -m py_compile tests/browser-smoke.py
      - name: Commit the test correction only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/browser-smoke.py
          git commit -m 'Measure refresh once per navigation after intentional scoreboard reloads'
          git push origin HEAD:refs/heads/fix/six-hour-manual-refresh-20261117
