name: Apply verified statistics update
on:
  push:
    branches: ['feat/12h-ladder-notes-20261116']
    paths: ['.github/workflows/apply-statistics-update.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/feat/12h-ladder-notes-20261116'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply reviewed notes and browser regression patch
        env:
          PATCH1: 
          PATCH2: 
        run: |
          python - <<'PY'
          import os,base64,lzma,hashlib,subprocess
          patch=lzma.decompress(base64.b64decode(os.environ['PATCH1']+os.environ['PATCH2']))
          assert hashlib.sha256(patch).hexdigest()=='acf8cde699c8e21ee275f7ec8d885817ce45d07134fadff0e6d83259dc4f4f25'
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          PY
      - name: Install matching shared statistics modules and versioned assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import urllib.request,hashlib,json
          base='https://79b9c06d.my-starlog.pages.dev/'
          for src,dest,digest in [('elo-public.js','starlog/elo-public.js','a3de67b4486984b022e52a2a4d8e16972090818ac3a51fd19be0431300c980bb'),('tests/elo-public.test.mjs','tests/elo-public.test.mjs','02df26e5f9f79b0644804e5d2026e0968335f8772496e06b643663f66ef42eae')]:
              data=urllib.request.urlopen(base+src,timeout=30).read()
              assert hashlib.sha256(data).hexdigest()==digest,src
              Path(dest).write_bytes(data)
          p=Path('starlog/index.html');s=p.read_text();s=s.replace('<script src="elo-public.js?', '<script src="elo-notes.js?v=2.0.20"></script>\n<script src="elo-public.js?');p.write_text(s)
          p=Path('starlog/sw.js');p.write_text(p.read_text().replace("'./elo-public.css?v='+VERSION", "'./elo-public.css?v='+VERSION,'./elo-notes.js?v='+VERSION"))
          for name in ['starlog/app.js','starlog/index.html','starlog/sw.js','starlog/version.json']:
              p=Path(name);p.write_text(p.read_text().replace('2.0.19','2.0.20'))
          for name in ['index.html','version.json','starlog-embed.js','starlog-theme.js']:
              p=Path(name)
              if p.exists():p.write_text(p.read_text().replace('5.24.29','5.24.30').replace('2.0.19','2.0.20'))
          p=Path('version.json');d=json.loads(p.read_text());d['notes']='12시간 간격 전적 갱신 · 래더 합산 통계 · 자동연동 경기 메모와 피드백';p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Verify and commit only feature changes
        run: |
          node --test tests/*.test.mjs
          git add index.html version.json starlog-embed.js starlog/app.js starlog/index.html starlog/sw.js starlog/version.json starlog/elo-public.js starlog/elo-notes.js tests/elo-notes.test.mjs tests/elo-public.test.mjs tests/elo-public-smoke.py tests/starlog-record-sources.test.mjs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preserve synced-match annotations and combine ladder in 12-hour statistics'
          git push origin HEAD:refs/heads/feat/12h-ladder-notes-20261116
