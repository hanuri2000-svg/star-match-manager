name: Resolve requested youth player links
on:
  push:
    branches: ['ops/youth-tier-lookup-20261117']
    paths: ['.github/workflows/youth-player-lookup.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Inspect ordinary public player directory
        run: |
          python - <<'PY'
          import json,re,urllib.request
          for url in ['https://eloboard.com/api/players','https://eloboard.com/players']:
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'star-match-manager-tier-sync/1.0','Accept':'text/html,application/json'}),timeout=25) as r:
                text=r.read(5000000).decode('utf-8');print('SOURCE',url,r.status,len(text))
              try:
                data=json.loads(text)
                def walk(x):
                  if isinstance(x,dict):
                    if any(re.sub(r'[^가-힣a-zA-Z0-9]','',str(x.get(k,''))) in ['수빛나','김아린'] for k in ['name','nickname','user_nick']): print('PLAYER',json.dumps(x,ensure_ascii=False)[:4000])
                    for v in x.values():walk(v)
                  elif isinstance(x,list):
                    for v in x:walk(v)
                walk(data)
              except ValueError:
                chunks=[json.loads(m) for m in re.findall(r'self\.__next_f\.push\(\[1,("(?:\\.|[^"\\])*")\]\)</script>',text)]
                text='\n'.join(chunks) or text
                for name in ['수빛나','김아린']:
                  for m in list(re.finditer(name,text))[:5]:print('MATCH',name,text[max(0,m.start()-250):m.end()+400])
            except Exception as exc:print('UNAVAILABLE',url,str(exc))
          PY
