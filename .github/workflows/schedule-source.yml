name: Schedule source snapshot
on:
  push:
    branches: ['feat/schedule-day-records-20261116']
    paths: ['.github/workflows/schedule-source.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c3f31b185a5b44efc9849421dad10337047a88fd
          persist-credentials: false
      - run: git archive --format=tar.gz -o schedule-source.tgz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: schedule-source
          path: schedule-source.tgz
          retention-days: 1
