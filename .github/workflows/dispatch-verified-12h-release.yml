name: Dispatch approved 12-hour release
on:
  push:
    branches: ['ops/deploy-12h-20261116']
    paths: ['.github/workflows/dispatch-verified-12h-release.yml']
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    if: github.ref == 'refs/heads/ops/deploy-12h-20261116'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Approve exact tested main SHA through the existing deployment gates
        uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo;
            const expectedSha = 'c3f31b185a5b44efc9849421dad10337047a88fd';
            const expectedTree = '7df4730a5b1943cfffb6fe1228011ffe956c376b';
            const {data: head} = await github.rest.git.getRef({...repo,ref:'heads/main'});
            if (head.object.sha !== expectedSha) throw new Error('Main changed; no deployment requested.');
            const {data: commit} = await github.rest.git.getCommit({...repo,commit_sha:expectedSha});
            if (commit.tree.sha !== expectedTree) throw new Error('Reviewed source tree mismatch.');
            const {data: validation} = await github.rest.actions.getWorkflowRun({...repo,run_id:43878100036});
            if (validation.head_sha!==expectedSha || validation.conclusion!=='success') {
              throw new Error('The exact-source regression and browser checks must succeed.');
            }
            await github.rest.actions.createWorkflowDispatch({...repo,
              workflow_id:'regression-tests.yml',ref:'main',
              inputs:{tested_sha:expectedSha,deploy_sha:expectedSha}});
            core.info('Requested existing gated verification/deployment for exact main SHA '+expectedSha);
            await core.summary.addHeading('Approved exact main deployment')
              .addRaw('The PR merge endpoint stalled. Main was advanced without force, with an expected-head lease, to the exact tested feature commit '+expectedSha+'. Existing code, browser, source and latest-SHA guards remain unchanged.').write();
