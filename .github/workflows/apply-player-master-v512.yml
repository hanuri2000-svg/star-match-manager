name: Apply shared player master DB
on:
  push:
    paths:
      - '.github/workflows/apply-player-master-v512.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build players.json and wire integrated site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json, os, base64, urllib.request, urllib.parse

          html_path=Path('index.html')
          html=html_path.read_text(encoding='utf-8')

          m=re.search(r'const TIER_DATA=(\[.*?\]);\s*const PLAYER_META=({.*?});\s*const TIER_LIVE=',html,re.S)
          if not m:
              raise SystemExit('TIER_DATA / PLAYER_META snapshot not found')
          tier_data=json.loads(m.group(1))
          player_meta=json.loads(m.group(2))
          fixes={'낭니':'냥니','빵체리':'땡세리','럭키위키':'럭키워키'}
          reverse_alias={v:k for k,v in fixes.items()}
          tier_order=['갓','킹','잭','조커','스페이드','0티어','1티어','2티어','3티어','4티어','5티어','6티어','7티어','8티어','유스']
          players=[]
          for group in tier_data:
              raw_tier=group.get('tier','')
              canonical_tier='유스' if raw_tier=='베이비' else raw_tier
              for p in group.get('players',[]):
                  old_name=p.get('name','')
                  name=fixes.get(old_name,old_name)
                  meta=player_meta.get(old_name) or player_meta.get(name) or {}
                  aliases=[]
                  if old_name!=name: aliases.append(old_name)
                  if name in reverse_alias and reverse_alias[name] not in aliases: aliases.append(reverse_alias[name])
                  players.append({
                      'name':name,
                      'tier':canonical_tier,
                      'tierLabel':'베이비' if canonical_tier=='유스' else canonical_tier,
                      'race':p.get('race',''),
                      'aliases':aliases,
                      'active':True,
                      'eloId':meta.get('id') or None,
                      'soopId':meta.get('s') or '',
                      'thumbUrl':meta.get('t') or ''
                  })
          # dedupe by normalized name, keep first tier-table occurrence
          def norm(v):
              import unicodedata
              v=unicodedata.normalize('NFKC',str(v or '')).lower()
              return re.sub(r'[^0-9a-z가-힣]','',v)
          dedup={}
          for p in players:
              dedup.setdefault(norm(p['name']),p)
          players=list(dedup.values())
          payload={
              'schemaVersion':1,
              'updatedAt':'2026-09-13',
              'source':{'name':'스타CK 밸런스 티어표','version':'3.61','date':'2026-08-29'},
              'tierOrder':tier_order,
              'players':players
          }
          players_text=json.dumps(payload,ensure_ascii=False,indent=2)+'\n'

          marker="window.HARINA_PLAYER_DIRECTORY=PLAYER_DIRECTORY;"
          if 'v5.12.0 · shared player master DB' not in html:
              inject=r'''
/* v5.12.0 · shared player master DB */
const SHARED_PLAYER_MASTER_URL='./players.json';
window.HARINA_MASTER_PLAYERS=[];
window.HARINA_MASTER_PAYLOAD=null;
async function loadSharedPlayerMaster(force=false){
  const res=await fetch(SHARED_PLAYER_MASTER_URL+(force?'?t='+Date.now():''),{cache:'no-store'});
  if(!res.ok)throw new Error('players.json load failed');
  const payload=await res.json(),list=Array.isArray(payload.players)?payload.players:[];
  const groups=new Map();
  list.filter(p=>p&&p.active!==false&&p.name).forEach(p=>{
    const label=p.tierLabel||(p.tier==='유스'?'베이비':p.tier||'미지정');
    if(!groups.has(label))groups.set(label,[]);
    groups.get(label).push({name:p.name,race:p.race||''});
  });
  const order=(payload.tierOrder||[]).map(t=>t==='유스'?'베이비':t);
  const rebuilt=[...order,...[...groups.keys()].filter(x=>!order.includes(x))].filter((x,i,a)=>a.indexOf(x)===i&&groups.has(x)).map(tier=>({tier,players:groups.get(tier)}));
  TIER_DATA.splice(0,TIER_DATA.length,...rebuilt);
  Object.keys(PLAYER_DIRECTORY).forEach(k=>delete PLAYER_DIRECTORY[k]);
  list.filter(p=>p&&p.active!==false&&p.name).forEach(p=>{
    const meta={name:p.name,tier:p.tier||'',race:p.race||''};
    PLAYER_DIRECTORY[normalizePlayerDirectoryName(p.name)]=meta;
    (p.aliases||[]).forEach(a=>{if(a)PLAYER_DIRECTORY[normalizePlayerDirectoryName(a)]=meta});
  });
  window.HARINA_MASTER_PLAYERS=list;
  window.HARINA_MASTER_PAYLOAD=payload;
  window.HARINA_PLAYER_DIRECTORY=PLAYER_DIRECTORY;
  window.dispatchEvent(new CustomEvent('harina-player-master-updated',{detail:{count:list.length}}));
  if(typeof render==='function')render();
  return payload;
}
window.HARINA_LOAD_PLAYER_MASTER=loadSharedPlayerMaster;
setTimeout(()=>loadSharedPlayerMaster().catch(err=>console.warn('공용 선수 DB 불러오기 실패, 내장 티어표 사용',err)),0);
'''
              if marker not in html: raise SystemExit('directory marker not found')
              html=html.replace(marker,marker+'\n'+inject,1)

          # Player DB management tab (read/search/export; global source remains players.json)
          if 'id="shared-player-master-ui"' not in html:
              ui=r'''
<script id="shared-player-master-ui">
(()=>{
  window.__masterDbSearch='';
  const masterList=()=>Array.isArray(window.HARINA_MASTER_PLAYERS)&&window.HARINA_MASTER_PLAYERS.length?window.HARINA_MASTER_PLAYERS:[];
  function masterPanel(){
    const q=String(window.__masterDbSearch||'').trim().toLowerCase();
    const all=masterList(),list=all.filter(p=>!q||[p.name,p.tier,p.race,...(p.aliases||[])].some(v=>String(v||'').toLowerCase().includes(q)));
    return `<section class="panel master-db-panel"><div class="master-db-head"><div><p class="eyebrow">SHARED PLAYER MASTER</p><h2>선수 DB 관리</h2><span>공용 원본 players.json · ${all.length}명 · 티어표/스폰노트/맞혀도랑 공통</span></div><div class="actions"><button class="secondary" data-master-refresh>↻ DB 새로고침</button><button class="primary" data-master-export>JSON 다운로드</button></div></div><div class="master-db-tools"><input data-master-search value="${esc(window.__masterDbSearch||'')}" placeholder="선수 이름·티어·종족 검색"><span>${list.length}명 표시</span></div><div class="master-db-table"><div class="master-db-row head"><b>선수</b><b>티어</b><b>종족</b><b>별칭</b></div>${list.map(p=>`<div class="master-db-row"><strong>${esc(p.name)}</strong><span>${esc(p.tier||'-')}</span><span class="master-race race-${esc(p.race||'R')}">${esc(p.race||'-')}</span><small>${esc((p.aliases||[]).join(', ')||'-')}</small></div>`).join('')||'<div class="settle-empty">조건에 맞는 선수가 없어.</div>'}</div><p class="master-db-note">이 화면은 공용 원본 확인·검색용이야. 전체 사용자에게 반영되는 수정은 GitHub의 <b>players.json</b> 원본을 변경해야 해. 맞혀도랑·스폰노트는 이 파일을 자동으로 읽어.</p></section>`;
  }
  const prev=render;
  render=function(){
    prev();
    if(new URLSearchParams(location.search).get('broadcast')==='1')return;
    const nav=document.querySelector('.app-tabs'),footer=document.querySelector('#app>footer');
    if(nav&&!nav.querySelector('[data-tab="playerdb"]'))nav.insertAdjacentHTML('afterbegin',`<button class="${s.activeTab==='playerdb'?'active':''}" data-act="tab" data-tab="playerdb">선수 DB</button>`);
    if(footer){footer.insertAdjacentHTML('beforebegin',`<div class="tab-view master-db-view" style="display:${s.activeTab==='playerdb'?'block':'none'}">${s.activeTab==='playerdb'?masterPanel():''}</div>`);if(s.activeTab==='playerdb')document.querySelectorAll('.tab-view:not(.master-db-view)').forEach(v=>v.style.display='none')}
  };
  document.addEventListener('input',e=>{if(e.target.matches('[data-master-search]')){window.__masterDbSearch=e.target.value;clearTimeout(window.__masterDbTimer);window.__masterDbTimer=setTimeout(render,120)}});
  document.addEventListener('click',e=>{
    if(e.target.closest('[data-master-refresh]'))loadSharedPlayerMaster(true).catch(()=>alert('공용 선수 DB를 새로고침하지 못했어.'));
    if(e.target.closest('[data-master-export]')){const data=window.HARINA_MASTER_PAYLOAD||{players:masterList()};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='players.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
  });
  document.head.insertAdjacentHTML('beforeend',`<style>.master-db-panel{padding:18px}.master-db-head{display:flex;justify-content:space-between;align-items:end;gap:14px;margin-bottom:12px}.master-db-head h2{margin:0 0 4px}.master-db-head span,.master-db-note,.master-db-tools span{color:var(--muted);font-size:12px}.master-db-tools{display:grid;grid-template-columns:minmax(240px,1fr) auto;gap:10px;align-items:center;margin-bottom:10px}.master-db-tools input{padding:9px 11px}.master-db-table{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}.master-db-row{display:grid;grid-template-columns:minmax(140px,1.4fr) minmax(80px,.7fr) 62px minmax(120px,1fr);gap:8px;align-items:center;padding:8px 11px;border-bottom:1px solid #eadfeb;color:#51445d;font-size:12px}.master-db-row:last-child{border-bottom:0}.master-db-row.head{position:sticky;top:0;background:#f6edf9;color:#75627f;font-size:11px;z-index:1}.master-race{display:grid;place-items:center;width:30px;height:25px;border-radius:8px;font-weight:900;color:#fff}.master-race.race-T{background:#3989cf}.master-race.race-Z{background:#8b55b7}.master-race.race-P{background:#d7a92c}.master-race.race-R{background:#65a889}.master-db-note{margin:10px 2px 0}@media(max-width:700px){.master-db-head{align-items:flex-start;flex-direction:column}.master-db-row{grid-template-columns:1.3fr .8fr 48px}.master-db-row small,.master-db-row.head b:last-child{display:none}}</style>`);
  setTimeout(()=>{if(typeof render==='function')render()},0);
})();
</script>
'''
              html=html.replace('</body>',ui+'\n</body>',1)

          html=html.replace("const APP_VERSION='5.11.0'","const APP_VERSION='5.12.0'",1)
          html=html.replace('star-prediction/?v=6.1.0','star-prediction/?v=6.2.0')
          html=html.replace('star-prediction/?embed=1&amp;v=6.1.0','star-prediction/?embed=1&amp;v=6.2.0')
          html_path.write_text(html,encoding='utf-8')

          readme=Path('README.md').read_text(encoding='utf-8')
          note='''\n## 공용 선수 마스터 DB\n\n- `players.json`을 티어·종족 공용 원본으로 사용합니다.\n- 통합 티어표, 맞혀도랑, 스폰노트가 같은 선수 DB를 읽도록 구성합니다.\n- 통합페이지의 `선수 DB` 탭에서 현재 공용 DB를 검색·확인·JSON 다운로드할 수 있습니다.\n- GitHub Pages 정적 구조이므로 사이트 화면에서 `players.json`을 서버에 직접 덮어쓰지는 않습니다. 원본 변경은 저장소 업데이트로 반영합니다.\n'''
          if '## 공용 선수 마스터 DB' not in readme: readme+=note
          Path('README.md').write_text(readme,encoding='utf-8')

          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']; branch='main'
          def api(path,method='GET',payload=None):
              url='https://api.github.com/repos/'+repo+'/contents/'+urllib.parse.quote(path,safe='/')
              req=urllib.request.Request(url,method=method,headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'player-master-migration'})
              if payload is not None:
                  req.data=json.dumps(payload).encode(); req.add_header('Content-Type','application/json')
              with urllib.request.urlopen(req) as r:return json.load(r)
          def put(path,text,message):
              try: sha=api(path).get('sha')
              except Exception: sha=None
              body={'message':message,'content':base64.b64encode(text.encode()).decode(),'branch':branch}
              if sha: body['sha']=sha
              api(path,'PUT',body)
          put('players.json',players_text,'Create shared player master DB')
          put('index.html',html,'Use shared player master DB and add player DB tab')
          put('README.md',readme,'Document shared player master DB')
          print('players',len(players))
          PY