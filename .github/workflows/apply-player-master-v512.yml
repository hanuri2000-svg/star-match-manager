name: Apply shared player master DB
on:
  push:
    paths:
      - '.github/workflows/apply-player-master-v512.yml'
      - 'scripts/apply_player_master.py'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply migration
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/apply_player_master.py
