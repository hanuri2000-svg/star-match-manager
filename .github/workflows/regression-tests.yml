name: JavaScript regression tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run all regression tests
        run: node --test tests/*.test.mjs

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned browser test tooling
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Check desktop, tablet, and all monthly themes
        run: python tests/browser-smoke.py
      - name: Save viewport screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-screen-browser-smoke
          path: test-results/browser-smoke/
          retention-days: 7
