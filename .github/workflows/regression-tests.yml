name: JavaScript regression tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tested_sha:
        description: 'Exact commit to verify (required for bot-created PR checks)'
        type: string
        default: ''
      deploy_sha:
        description: 'Separate production approval: exact current main SHA, blank = checks only'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify explicitly requested commit
        env:
          TESTED_SHA: ${{ inputs.tested_sha }}
        run: |
          if [ -n "$TESTED_SHA" ]; then test "$TESTED_SHA" = "$GITHUB_SHA"; fi
      - name: Verify new EloBoard approval receipts
        run: node scripts/verify-eloboard-receipt.mjs
      - name: Run all regression tests
        run: node --test tests/*.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate deployment workflow wiring
        run: |
          python -m pip install PyYAML==6.0.3
          python tests/pages-workflow.py

  browser-smoke:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright/python:v1.56.0-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned browser test tooling
        run: python -m pip install playwright==1.56.0
      - name: Check desktop, tablet, and all monthly themes
        run: python tests/browser-smoke.py
      - name: Save viewport screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-screen-browser-smoke
          path: test-results/browser-smoke/
          retention-days: 7

  build-pages:
    needs: [test, browser-smoke]
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.deploy_sha == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: read
    outputs:
      current: ${{ steps.guard.outputs.current }}
      artifact-name: ${{ steps.package.outputs.artifact-name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Check required results, latest main, and Actions publishing source
        id: guard
        uses: actions/github-script@v7
        env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}
        with:
          script: |
            const guard = require('./scripts/pages-deploy-guard.cjs');
            core.setOutput('current', await guard({github, context, core}));
      - name: Package the exact tested commit
        id: package
        if: steps.guard.outputs.current == 'true'
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir _site
          git archive "$GITHUB_SHA" -- . ':!.github' ':!tests' ':!scripts' ':!docs' ':!README.md' ':!.deploy-*' | tar -x -C _site
          node -e 'require("fs").writeFileSync("_site/deployment.json", JSON.stringify({sha:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID}) + "\n")'
          echo "artifact-name=github-pages-$GITHUB_SHA-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        if: steps.guard.outputs.current == 'true'
        with:
          name: ${{ steps.package.outputs.artifact-name }}
          path: _site

  deploy-pages:
    needs: [test, browser-smoke, build-pages]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.deploy_sha == github.sha && needs.build-pages.outputs.current == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    # Serialize promotions. Do not cancel an in-flight atomic Pages deployment.
    # Older runs re-check main after acquiring this slot and cannot roll it back.
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Recheck latest commit immediately before deployment
        id: guard
        uses: actions/github-script@v7
        env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}
        with:
          script: |
            const guard = require('./scripts/pages-deploy-guard.cjs');
            core.setOutput('current', await guard({github, context, core}));
      - name: Deploy verified commit
        id: deployment
        if: steps.guard.outputs.current == 'true'
        uses: actions/deploy-pages@v4
        with:
          # Reuse the producing job's name when only a failed deploy is rerun.
          artifact_name: ${{ needs.build-pages.outputs.artifact-name }}
