name: Align schedule request regression checks
on:
  push:
    branches: ['feat/schedule-day-records-20261116']
    paths: ['.github/workflows/schedule-test-adapter.yml']
permissions:
  contents: write
jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Preserve regression coverage with the shared schedule request
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('tests/browser-smoke.py');s=p.read_text()
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='053c4fd2c58d4483f730043066b4f118acb673ba0ce3f64835d7f048f682cf04'
          old='        await page.wait_for_function("window.__appBootReady === true")'
          new=old+'\n        await asyncio.wait_for(recent_requested.wait(), timeout=15)\n        assert requested_urls.count(recent_url) == 1, "schedule should request the fixed player recent list once"'
          assert s.count(old)==1
          s=s.replace(old,new,1)
          s=s.replace("                assert not any('/api/elo/public/recent?' in url for url in requested_urls)","                assert requested_urls.count(recent_url) == 1, 'statistics must not repeat the schedule recent request'",1)
          s=s.replace("                # DOM creation alone does not prove that the async controller's\n                # request reached the browser interceptor. Observe it before\n                # changing the source and destroying that controller.","                # The schedule already requested this list; opening records shares\n                # the same 12-hour cache/failed-attempt state without extra I/O.")
          s=s.replace("        # Statistics read summary/activity; the fixed player's recent list is\n        # requested only after the records view is opened above. Legacy import,", "        # Statistics read summary/activity; schedule and records share the fixed\n        # player's recent list. Legacy import,")
          p.write_text(s)
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='b6d62acf0d352869858eecaf255b189218c67f2c8ccfa41c03812204e26272b3'
          PY
          python -m py_compile tests/browser-smoke.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/browser-smoke.py
          git commit -m 'Verify schedule and statistics share the same recent-record request'
          git push origin HEAD:refs/heads/feat/schedule-day-records-20261116
