name: Review EloBoard tiers

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/sync-eloboard-tiers.mjs'
      - 'tests/sync-eloboard-tiers.test.mjs'
      - '.github/workflows/sync-eloboard-tiers.yml'

permissions:
  contents: read

concurrency:
  group: sync-eloboard-tiers
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test EloBoard tier sync
        run: node --test tests/sync-eloboard-tiers.test.mjs
      - name: Compare EloBoard tiers without changing the DB
        run: node scripts/sync-eloboard-tiers.mjs --proposal-dir=tier-sync-proposal
      - name: Save source snapshot and changes for review
        uses: actions/upload-artifact@v4
        with:
          name: eloboard-tier-proposal
          path: tier-sync-proposal/
          retention-days: 7
