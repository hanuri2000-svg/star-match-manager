name: Apply verified local statistics and annotations
on:
  push:
    branches: ['feat/12h-ladder-notes-20261116']
    paths: ['.github/workflows/apply-statistics-local.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/feat/12h-ladder-notes-20261116'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: hanuri2000-svg/spwn-note
          ref: 1d123d38032cf22a71ebf7918e1d571b342914ca
          path: .verified-shared-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply exact hash-verified source patches
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,base64,lzma,hashlib,subprocess,json
          def decode(path,expected):
              text=Path(path).read_text()
              payload=''.join(re.search(r'^\s+PATCH'+str(i)+r': (\S+)$',text,re.M).group(1) for i in [1,2])
              data=lzma.decompress(base64.b64decode(payload))
              assert hashlib.sha256(data).hexdigest()==expected,path
              return data
          notes=decode('.github/workflows/apply-statistics-update.yml','acf8cde699c8e21ee275f7ec8d885817ce45d07134fadff0e6d83259dc4f4f25')
          subprocess.run(['git','apply','--index','-'],input=notes,check=True)
          common=decode('.verified-shared-source/.github/workflows/apply-statistics-local.yml','22dc8ec9a03038a02e080f13bff4343a775767f1373523623ce66ddab1ba5735')
          common=common.replace(b'a/elo-public.js',b'a/starlog/elo-public.js').replace(b'b/elo-public.js',b'b/starlog/elo-public.js')
          subprocess.run(['git','apply','--index','-'],input=common,check=True)
          assert hashlib.sha256(Path('starlog/elo-public.js').read_bytes()).hexdigest()=='a3de67b4486984b022e52a2a4d8e16972090818ac3a51fd19be0431300c980bb'
          p=Path('starlog/index.html');s=p.read_text();s=s.replace('<script src="elo-public.js?', '<script src="elo-notes.js?v=2.0.20"></script>\n<script src="elo-public.js?');p.write_text(s)
          p=Path('starlog/sw.js');p.write_text(p.read_text().replace("'./elo-public.css?v='+VERSION", "'./elo-public.css?v='+VERSION,'./elo-notes.js?v='+VERSION"))
          for name in ['starlog/app.js','starlog/index.html','starlog/sw.js','starlog/version.json']:
              p=Path(name);p.write_text(p.read_text().replace('2.0.19','2.0.20'))
          for name in ['index.html','version.json','starlog-embed.js','starlog-theme.js']:
              p=Path(name)
              if p.exists():p.write_text(p.read_text().replace('5.24.29','5.24.30').replace('2.0.19','2.0.20'))
          p=Path('version.json');d=json.loads(p.read_text());d['notes']='12시간 간격 전적 갱신 · 래더 합산 통계 · 자동연동 경기 메모와 피드백';p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Verify and commit feature changes only
        run: |
          node --test tests/*.test.mjs
          git add index.html version.json starlog-embed.js starlog/app.js starlog/index.html starlog/sw.js starlog/version.json starlog/elo-public.js starlog/elo-notes.js tests/elo-notes.test.mjs tests/elo-public.test.mjs tests/elo-public-smoke.py tests/starlog-record-sources.test.mjs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preserve synced-game notes and show ladder in unified 12-hour statistics'
          git push origin HEAD:refs/heads/feat/12h-ladder-notes-20261116
