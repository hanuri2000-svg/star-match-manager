<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>스타 CK·PL 대진 관리</title>
<style>:root{--bg:#080b14;--panel:#121728;--line:#29324d;--text:#f4f6ff;--muted:#929bb8;--purple:#8067ff;--green:#45d6a0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% -10%,#24204d 0,transparent 35%),var(--bg);color:var(--text);font-family:Pretendard,"Noto Sans KR",Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:1px solid transparent;border-radius:10px;padding:11px 15px;color:var(--text);background:#242c44;font-weight:750}button:hover{filter:brightness(1.12)}main{width:min(1440px,100%);margin:auto;padding:34px 28px 60px}.head{display:flex;justify-content:space-between;gap:24px;align-items:flex-end;margin-bottom:24px}.eyebrow{margin:0 0 8px;color:#a895ff;font-size:12px;font-weight:800;letter-spacing:.18em}h1,h2,p{margin-top:0}h1{margin-bottom:8px;font-size:clamp(30px,4vw,50px);letter-spacing:-.05em}h2{margin-bottom:0}.sub,.empty{color:var(--muted)}.actions{display:flex;flex-wrap:wrap;gap:8px}.primary{background:linear-gradient(135deg,var(--purple),#6750d8)}.secondary{border-color:var(--line);background:#121728}.danger{color:#ff9bac;border-color:#5a2b3b;background:#25121a}.panel{border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,#151b2e,#101523);box-shadow:0 16px 40px #0004}.settings{display:grid;grid-template-columns:1.2fr .7fr 2fr;gap:16px;padding:18px;margin-bottom:18px}label{display:grid;gap:7px;color:var(--muted);font-size:12px;font-weight:750}input,select{width:100%;border:1px solid #303a59;border-radius:10px;padding:11px 12px;outline:none;background:#0c101d;color:var(--text)}input:focus,select:focus{border-color:var(--purple)}.note{display:flex;align-items:center;gap:12px;border-left:1px solid var(--line);padding-left:18px;color:var(--muted);font-size:13px}.note b{flex:none;color:#fff;border:1px solid #604dce;border-radius:8px;padding:6px 9px;background:#282052}.teams{display:grid;grid-template-columns:1fr 1fr;gap:18px}.team{padding:18px}.team-name{margin-bottom:14px;padding:5px 0 12px;border-width:0 0 1px;border-radius:0;background:transparent;font-size:24px;font-weight:850}.player-form{display:grid;grid-template-columns:1.5fr .7fr 1fr auto;gap:8px}.roster{display:grid;gap:7px;margin-top:14px}.empty{text-align:center;font-size:13px}.player{display:grid;grid-template-columns:34px 1fr 1fr 34px;align-items:center;gap:8px;padding:7px;border-radius:10px;background:#0d1220}.player span:nth-child(3){color:var(--muted);font-size:13px}.chip{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;font-weight:900;font-size:12px}.P{background:#325ecb}.T{background:#cb5545}.Z{background:#7a3ec9}.R{background:#3a9c7b}.x{padding:2px;background:transparent;color:var(--muted);font-size:22px}.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:22px 30px;margin-top:24px;border-color:#4d447f;background:linear-gradient(110deg,#181938,#111527 50%,#241631)}.score>div:not(.score-label){display:flex;align-items:center;justify-content:flex-end;gap:22px;font-size:22px;font-weight:800}.score>div:last-child{justify-content:flex-start}.score strong{font-size:42px}.score-label{padding:0 34px;color:var(--muted);font-size:11px;letter-spacing:.2em}.section-title{display:flex;justify-content:space-between;align-items:end;margin:28px 0 14px}.matches{display:grid;gap:10px}.match{display:grid;grid-template-columns:58px 120px minmax(230px,1fr) 38px minmax(230px,1fr) 28px;align-items:center;gap:12px;padding:12px 14px}.match.done{border-color:#3b755f}.num{font-size:28px;font-weight:900}.map input{padding:9px}.fighter{display:grid;grid-template-columns:1.4fr 1fr 68px;gap:7px;padding:5px;border:1px solid transparent;border-radius:12px}.fighter.win{border-color:#3fc08f;background:#173a30}.fighter button{padding:8px;font-size:12px}.fighter.win button{background:var(--green);color:#071b14}.vs{text-align:center;color:var(--muted);font-size:11px;font-weight:900}.blank{display:grid;place-items:center;gap:7px;padding:45px}footer{padding-top:30px;color:#68728f;text-align:center;font-size:12px}@media(max-width:960px){.head{align-items:flex-start;flex-direction:column}.settings{grid-template-columns:1fr 1fr}.note{grid-column:1/-1;border-left:0;border-top:1px solid var(--line);padding:14px 0 0}.teams{grid-template-columns:1fr}.match{position:relative;grid-template-columns:50px 1fr 28px}.map{grid-column:2}.fighter,.vs{grid-column:1/-1}.match>.x{position:absolute;right:16px}}@media(max-width:600px){main{padding:22px 14px 45px}.settings{grid-template-columns:1fr}.note{grid-column:auto}.player-form{grid-template-columns:1fr 1fr}.player-form input:first-child{grid-column:1/-1}.score{padding:16px}.score>div:not(.score-label){gap:10px;font-size:15px}.score strong{font-size:32px}.score-label{padding:0 10px}.fighter{grid-template-columns:1fr 1fr}.fighter button{grid-column:1/-1}}</style></head><body><main id="app"></main>
<script>
const KEY='star-match-manager-v1',races={P:'프로토스',T:'테란',Z:'저그',R:'랜덤'},fresh=()=>({title:'오늘의 CK',mode:'CK',teamA:'A팀',teamB:'B팀',playersA:[],playersB:[],matches:[]});let s;try{s=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{s=fresh()}const id=()=>Math.random().toString(36).slice(2,10),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),raceOpts=v=>Object.entries(races).map(([k,n])=>`<option value="${k}" ${k===v?'selected':''}>${n}</option>`).join(''),random=()=>['랜능크','빨무'].includes(s.mode),save=()=>{localStorage.setItem(KEY,JSON.stringify(s));render()},players=()=>[...s.playersA,...s.playersB];
function playerPanel(side){let ps=s['players'+side],team=s['team'+side];return `<section class="panel team"><input class="team-name" data-act="team" data-side="${side}" value="${esc(team)}"><div class="player-form"><input id="name${side}" placeholder="선수 이름"><input id="tier${side}" placeholder="티어"><select id="race${side}">${raceOpts('P')}</select><button class="primary" data-act="add-player" data-side="${side}">선수 추가</button></div><div class="roster">${ps.length?ps.map(p=>`<div class="player"><span class="chip ${p.race}">${p.race}</span><strong>${esc(p.name)}</strong><span>${esc(p.tier||'티어 미입력')}</span><button class="x" data-act="del-player" data-side="${side}" data-id="${p.id}">×</button></div>`).join(''):'<p class="empty">등록된 선수가 없어</p>'}</div></section>`}
function matchRow(m,i){let pa=s.playersA.map(p=>`<option value="${p.id}" ${p.id===m.a?'selected':''}>${esc(p.name)}${p.tier?' · '+esc(p.tier):''}</option>`).join(''),pb=s.playersB.map(p=>`<option value="${p.id}" ${p.id===m.b?'selected':''}>${esc(p.name)}${p.tier?' · '+esc(p.tier):''}</option>`).join('');return `<article class="match panel ${m.winner?'done':''}" data-id="${m.id}"><div class="num">${i+1}</div><div class="map"><input data-field="map" placeholder="맵 이름" value="${esc(m.map)}"></div><div class="fighter ${m.winner==='A'?'win':''}"><select data-field="a"><option value="">${esc(s.teamA)} 선수 선택</option>${pa}</select><select data-field="raceA">${raceOpts(m.raceA)}</select><button data-act="winner" data-side="A">${m.winner==='A'?'승리 ✓':'승리'}</button></div><span class="vs">VS</span><div class="fighter ${m.winner==='B'?'win':''}"><select data-field="b"><option value="">${esc(s.teamB)} 선수 선택</option>${pb}</select><select data-field="raceB">${raceOpts(m.raceB)}</select><button data-act="winner" data-side="B">${m.winner==='B'?'승리 ✓':'승리'}</button></div><button class="x" data-act="del-match">×</button></article>`}
function render(){let a=s.matches.filter(m=>m.winner==='A').length,b=s.matches.filter(m=>m.winner==='B').length;document.querySelector('#app').innerHTML=`<header class="head"><div><p class="eyebrow">STARCRAFT MATCH CONTROL</p><h1>CK·PL 대진 관리</h1><p class="sub">대진 편성부터 출전 종족과 승패까지 한 화면에서 관리해.</p></div><div class="actions"><button class="secondary" data-act="export">백업 저장</button><button class="secondary" data-act="import">백업 불러오기</button><input id="file" type="file" accept="application/json" hidden><button class="danger" data-act="reset">전체 초기화</button></div></header><section class="panel settings"><label>대회·방송 제목<input data-act="title" value="${esc(s.title)}"></label><label>경기 방식<select data-act="mode">${['CK','PL','랜능크','빨무'].map(x=>`<option ${x===s.mode?'selected':''}>${x}</option>`).join('')}</select></label><div class="note"><b>${s.mode}</b><span>${random()?'기본은 랜덤이지만 저티어 선수는 경기별 지정 종족으로 바꿀 수 있어.':'선수 본종이 자동 입력되고 경기별로 부종을 선택할 수 있어.'}</span></div></section><section class="teams">${playerPanel('A')}${playerPanel('B')}</section><section><div class="score panel"><div><span>${esc(s.teamA)}</span><strong>${a}</strong></div><div class="score-label">SCORE</div><div><strong>${b}</strong><span>${esc(s.teamB)}</span></div></div><div class="section-title"><div><p class="eyebrow">MATCH ORDER</p><h2>대진표</h2></div><button class="primary" data-act="add-match">+ 경기 추가</button></div><div class="matches">${s.matches.length?s.matches.map(matchRow).join(''):'<div class="panel blank"><strong>아직 편성된 경기가 없어</strong><span class="empty">선수를 등록한 다음 ‘경기 추가’를 눌러 시작해.</span></div>'}</div></section><footer>입력한 내용은 이 기기에 자동 저장돼.</footer>`}
document.addEventListener('input',e=>{let t=e.target;if(t.dataset.act==='title'){s.title=t.value;localStorage.setItem(KEY,JSON.stringify(s))}if(t.dataset.act==='team'){s['team'+t.dataset.side]=t.value;localStorage.setItem(KEY,JSON.stringify(s))}if(t.closest('.match')&&t.dataset.field){let m=s.matches.find(x=>x.id===t.closest('.match').dataset.id),f=t.dataset.field;m[f]=t.value;if(f==='a'||f==='b'){let p=players().find(x=>x.id===t.value);m[f==='a'?'raceA':'raceB']=random()?'R':p?.race||'P'}save()}});document.addEventListener('change',e=>{if(e.target.dataset.act==='mode'){s.mode=e.target.value;save()}if(e.target.id==='file'){let f=e.target.files[0];if(f)f.text().then(x=>{try{s=JSON.parse(x);save()}catch{alert('불러올 수 없는 파일이야.')}})}});document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return,a=b.dataset.act,side=b.dataset.side;if(a==='add-player'){let n=document.querySelector('#name'+side),t=document.querySelector('#tier'+side),r=document.querySelector('#race'+side);if(n.value.trim()){s['players'+side].push({id:id(),name:n.value.trim(),tier:t.value.trim(),race:r.value});save()}}if(a==='del-player'){s['players'+side]=s['players'+side].filter(p=>p.id!==b.dataset.id);s.matches.forEach(m=>{if(m.a===b.dataset.id)m.a='';if(m.b===b.dataset.id)m.b=''});save()}if(a==='add-match'){s.matches.push({id:id(),map:'',a:'',b:'',raceA:random()?'R':'P',raceB:random()?'R':'P',winner:''});save()}if(a==='winner'){let m=s.matches.find(x=>x.id===b.closest('.match').dataset.id);m.winner=m.winner===side?'':side;save()}if(a==='del-match'){s.matches=s.matches.filter(x=>x.id!==b.closest('.match').dataset.id);save()}if(a==='reset'&&confirm('현재 대진표와 선수 명단을 모두 초기화할까?')){s=fresh();save()}if(a==='export'){let u=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:'application/json'})),x=document.createElement('a');x.href=u;x.download=(s.title||'대진표')+'.json';x.click();URL.revokeObjectURL(u)}if(a==='import')document.querySelector('#file').click()});render();
</script></body></html>
