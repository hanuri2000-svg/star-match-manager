document.head.insertAdjacentHTML('beforeend',`<style>.player-form{grid-template-columns:1.35fr .9fr 1fr 1fr auto}.set-block{margin:0 0 24px;padding:18px;border:1px solid #343d5d;border-radius:20px;background:#0b101d}.set-head{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:20px;margin-bottom:12px}.set-head h3{margin:0;font-size:22px}.set-winner{color:var(--green)}.set-controls{display:flex;align-items:end;gap:8px}.set-controls label{min-width:110px}.set-controls select{padding:8px}.set-controls button{padding:9px 12px}.set-score{display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:12px;background:#181f34}.set-score strong{font-size:24px}.set-score span{color:var(--muted)}@media(max-width:700px){.player-form{grid-template-columns:1fr 1fr}.player-form input:first-child{grid-column:1/-1}.set-head{grid-template-columns:1fr auto}.set-score{grid-row:1;grid-column:2}.set-controls{grid-column:1/-1}}</style>`);

document.head.insertAdjacentHTML('beforeend',`<style>@media(min-width:961px){main{width:min(1800px,100%);padding:14px 18px 24px}.head{align-items:center;margin-bottom:10px}.head h1{font-size:30px;margin-bottom:2px}.head .eyebrow{margin-bottom:2px;font-size:9px}.sub{font-size:12px}.actions{gap:5px}.actions button,button{padding:7px 10px;border-radius:8px;font-size:12px}.settings{grid-template-columns:1.1fr .55fr 1.7fr;padding:9px 12px;margin-bottom:9px;gap:9px}.settings label{gap:3px}.settings input,.settings select{padding:7px 9px}.note{font-size:11px}.teams{gap:9px}.team{padding:9px 11px}.team-name{font-size:18px;margin-bottom:7px;padding:2px 0 6px}.player-form{gap:5px}.player-form input,.player-form select{padding:7px 8px;font-size:12px}.roster{grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;margin-top:7px}.player{grid-template-columns:28px 1fr 1.25fr 24px;min-height:32px;padding:2px 5px;font-size:12px}.chip{width:23px;height:23px;font-size:10px}.player .x{font-size:17px}.score{margin-top:9px;padding:7px 20px}.score>div:not(.score-label){font-size:15px;gap:12px}.score strong{font-size:27px}.section-title{margin:10px 0 7px}.section-title h2{font-size:21px}.section-title .eyebrow{font-size:9px}.set-block{margin-bottom:9px;padding:8px 10px;border-radius:13px}.set-head{gap:10px;margin-bottom:5px}.set-head .eyebrow{margin-bottom:1px;font-size:8px}.set-head h3{font-size:16px}.set-controls label{min-width:90px}.set-controls select{padding:5px 7px}.set-score{padding:4px 10px}.set-score strong{font-size:18px}.matches{gap:4px}.match{grid-template-columns:38px 100px minmax(220px,1fr) 28px minmax(220px,1fr) 18px;gap:6px;padding:4px 7px;border-radius:10px}.num{font-size:18px}.map input,.fighter select{padding:6px 7px;font-size:11px}.fighter{grid-template-columns:1.4fr .85fr 55px;gap:4px;padding:2px}.fighter button{padding:6px 4px;font-size:10px}footer{padding-top:8px;font-size:10px}.winner-settings{padding-top:7px}.winner-settings select{padding:6px}}</style>`);
document.head.insertAdjacentHTML('beforeend',`<style>.settlement{margin-top:14px;padding:16px}.settle-title{display:flex;align-items:end;justify-content:space-between;margin-bottom:12px}.settle-title h2{font-size:22px}.settle-title>span{color:var(--muted);font-size:12px}.settle-form{display:grid;grid-template-columns:1.3fr repeat(5,1fr);gap:8px}.settle-summary{display:grid;grid-template-columns:.8fr 1.1fr 1.1fr;gap:8px;margin-top:12px}.settle-summary>div{display:grid;gap:3px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#0c101d}.settle-summary span,.settle-summary small,.settle-detail{color:var(--muted);font-size:11px}.settle-summary strong{font-size:20px}.settle-summary .win-pay{border-color:#3fc08f;background:#173a30}.settle-empty{margin-top:12px;padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}.settle-detail{margin:7px 2px 0}@media(min-width:961px){.settlement{padding:9px 11px}.settle-title{margin-bottom:7px}.settle-form input,.settle-form select{padding:6px 7px;font-size:11px}.settle-summary{margin-top:7px}.settle-summary>div{padding:6px 9px}.settle-summary strong{font-size:16px}}@media(max-width:960px){.settle-form{grid-template-columns:repeat(2,1fr)}.settle-summary{grid-template-columns:1fr}}@media(max-width:520px){.settle-form{grid-template-columns:1fr}}</style>`);
const APP_VERSION='2.1.1',KEY='star-match-manager-v1',races={P:'프로토스',T:'테란',Z:'저그',R:'랜덤'},tiers=['갓','킹','잭','조커','스페이드','0티어','1티어','2티어','3티어','4티어','5티어','6티어','7티어','8티어','유스'],fresh=()=>({title:'오늘의 CK',mode:'CK',teamA:'A팀',teamB:'B팀',playersA:[],playersB:[],matches:[],setGames:[1],aces:[],winnerEnd:'elimination',winnerFixed:7,activeTab:'match',settlement:{mode:'main',mainFunding:0,entryPerPerson:0,winRatio:6,loseRatio:4,winner:'',playerFunding:{}}});let s;try{s=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{s=fresh()}s.setGames=s.setGames||[Math.max(1,s.matches?.length||1)];s.matches=(s.matches||[]).map(m=>({...m,set:m.set||1}));s.aces=s.aces||[];s.winnerEnd=s.winnerEnd||'elimination';s.winnerFixed=s.winnerFixed||7;s.activeTab=s.activeTab||'match';s.settlement={mode:'main',mainFunding:0,entryPerPerson:0,winRatio:6,loseRatio:4,winner:'',playerFunding:{},...(s.settlement||{})};s.settlement.playerFunding=s.settlement.playerFunding||{};const id=()=>Math.random().toString(36).slice(2,10),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),raceOpts=v=>Object.entries(races).map(([k,n])=>`<option value="${k}" ${k===v?'selected':''}>${n}</option>`).join(''),subRaceOpts=v=>'<option value="">부종 선택</option>'+['P','T','Z'].map(k=>`<option value="${k}" ${k===v?'selected':''}>${races[k]}</option>`).join(''),tierOpts=v=>'<option value="">티어 선택</option>'+tiers.map(t=>`<option value="${t}" ${t===v?'selected':''}>${t}</option>`).join(''),random=()=>['랜능크','빨무'].includes(s.mode),newMatch=set=>({id:id(),set,map:'',a:'',b:'',raceA:random()?'R':'P',raceB:random()?'R':'P',winner:''}),syncSets=()=>{if(s.mode==='위너스'){let count=s.winnerEnd==='elimination'?Math.max(1,s.playersA.length+s.playersB.length-1):s.winnerFixed;s.setGames=s.setGames.map(()=>count)}s.setGames.forEach((count,i)=>{let set=i+1,ms=s.matches.filter(m=>m.set===set);while(ms.length<count){let m=newMatch(set);s.matches.push(m);ms.push(m)}if(ms.length>count){let remove=new Set(ms.slice(count).map(m=>m.id));s.matches=s.matches.filter(m=>!remove.has(m.id))}})},setResult=setNo=>{let ms=s.matches.filter(m=>m.set===setNo),a=ms.filter(m=>m.winner==='A').length,b=ms.filter(m=>m.winner==='B').length;if(s.mode==='위너스'&&s.winnerEnd==='elimination'){let lostA=new Set(ms.filter(m=>m.winner==='B').map(m=>m.a).filter(Boolean)),lostB=new Set(ms.filter(m=>m.winner==='A').map(m=>m.b).filter(Boolean));if(s.playersA.length&&lostA.size>=s.playersA.length)return{a,b,winner:'B',done:true};if(s.playersB.length&&lostB.size>=s.playersB.length)return{a,b,winner:'A',done:true};return{a,b,winner:'',done:false}}let done=ms.length===s.setGames[setNo-1]&&ms.every(m=>m.winner),winner=done&&a!==b?(a>b?'A':'B'):'';return{a,b,winner,done}},save=()=>{syncSets();localStorage.setItem(KEY,JSON.stringify(s));render()},players=()=>[...s.playersA,...s.playersB];syncSets();
function playerPanel(side){let ps=s['players'+side],team=s['team'+side];return `<section class="panel team"><input class="team-name" data-act="team" data-side="${side}" value="${esc(team)}"><div class="player-form"><input id="name${side}" placeholder="선수 이름"><select id="tier${side}">${tierOpts('')}</select><select id="race${side}">${raceOpts('P')}</select><select id="subrace${side}">${subRaceOpts('')}</select><button class="primary" data-act="add-player" data-side="${side}">선수 추가</button></div><div class="roster">${ps.length?ps.map(p=>`<div class="player"><span class="chip ${p.race}">${p.race}</span><strong>${esc(p.name)}</strong><span>${esc(p.tier||'티어 미입력')} · 본 ${p.race}${p.subrace?' / 부 '+p.subrace:''}</span><button class="x" data-act="del-player" data-side="${side}" data-id="${p.id}">×</button></div>`).join(''):'<p class="empty">등록된 선수가 없어</p>'}</div></section>`}
function matchRow(m,i,ace=false){let earlier=ace?[]:s.matches.filter(x=>x.set===m.set).slice(0,i),lostA=new Set(earlier.filter(x=>x.winner==='B').map(x=>x.a)),lostB=new Set(earlier.filter(x=>x.winner==='A').map(x=>x.b)),pa=s.playersA.map(p=>`<option value="${p.id}" ${p.id===m.a?'selected':''} ${s.mode==='위너스'&&lostA.has(p.id)&&p.id!==m.a?'disabled':''}>${esc(p.name)}${p.tier?' · '+esc(p.tier):''}${s.mode==='위너스'&&lostA.has(p.id)?' · 탈락':''}</option>`).join(''),pb=s.playersB.map(p=>`<option value="${p.id}" ${p.id===m.b?'selected':''} ${s.mode==='위너스'&&lostB.has(p.id)&&p.id!==m.b?'disabled':''}>${esc(p.name)}${p.tier?' · '+esc(p.tier):''}${s.mode==='위너스'&&lostB.has(p.id)?' · 탈락':''}</option>`).join('');return `<article class="match panel ${m.winner?'done':''}" data-id="${m.id}" data-ace="${ace}"><div class="num">${ace?'ACE':i+1}</div><div class="map"><input data-field="map" placeholder="맵 이름" value="${esc(m.map)}"></div><div class="fighter ${m.winner==='A'?'win':''}"><select data-field="a"><option value="">${esc(s.teamA)} 선수 선택</option>${pa}</select><select data-field="raceA">${raceOpts(m.raceA)}</select><button data-act="winner" data-side="A">${m.winner==='A'?'승리 ✓':'승리'}</button></div><span class="vs">VS</span><div class="fighter ${m.winner==='B'?'win':''}"><select data-field="b"><option value="">${esc(s.teamB)} 선수 선택</option>${pb}</select><select data-field="raceB">${raceOpts(m.raceB)}</select><button data-act="winner" data-side="B">${m.winner==='B'?'승리 ✓':'승리'}</button></div>${ace?'<button class="x" data-act="del-ace">×</button>':'<span></span>'}</article>`}
function setSection(setNo){let ms=s.matches.filter(m=>m.set===setNo),result=setResult(setNo),winner=result.winner==='A'?s.teamA:result.winner==='B'?s.teamB:'';return `<section class="set-block"><div class="set-head"><div><p class="eyebrow">SET ${setNo}</p><h3>${setNo}세트 ${winner?`· <span class="set-winner">${esc(winner)} 승리</span>`:''}</h3></div><div class="set-controls">${s.mode==='위너스'&&s.winnerEnd==='elimination'?'<span class="empty">전원 탈락까지</span>':`<label>경기 수<select data-act="set-games" data-set="${setNo}">${[1,3,5,7,9,11,13,15].map(n=>`<option value="${n}" ${n===s.setGames[setNo-1]?'selected':''}>${n}경기</option>`).join('')}</select></label>`}${s.setGames.length>1?`<button class="danger" data-act="del-set" data-set="${setNo}">세트 삭제</button>`:''}</div><div class="set-score"><strong>${result.a}</strong><span>:</span><strong>${result.b}</strong></div></div><div class="matches">${ms.map((m,i)=>matchRow(m,i)).join('')}</div></section>`}
function aceSection(){return s.aces.length?`<section class="set-block ace-block"><div class="set-head"><div><p class="eyebrow">ACE DECIDER</p><h3>에이스 결정전</h3></div></div><div class="matches">${s.aces.map((m,i)=>matchRow(m,i,true)).join('')}</div></section>`:''}
const playerName=id=>players().find(p=>p.id===id)?.name||'미정';
function overviewRow(m,label){let winner=m.winner==='A'?s.teamA:m.winner==='B'?s.teamB:'진행 전';return `<div class="overview-row ${m.winner?'finished':''}" data-match-id="${m.id}"><strong>${label}</strong><span class="overview-map" data-overview-map="${m.id}">${esc(m.map||'맵 미정')}</span><span>${esc(playerName(m.a))} <small>${m.raceA}</small></span><b>VS</b><span>${esc(playerName(m.b))} <small>${m.raceB}</small></span><em>${esc(winner)}</em></div>`}
function overviewPanel(){let results=s.setGames.map((_,i)=>setResult(i+1)),current=results.findIndex(r=>!r.done),scores=results.map((r,i)=>`<div class="live-set ${r.done?'done':i===current?'current':''}"><span>${i+1}세트</span><strong>${r.a} : ${r.b}</strong>${r.winner?`<small>${esc(r.winner==='A'?s.teamA:s.teamB)} 승</small>`:''}</div>`).join(''),rows=s.setGames.flatMap((_,i)=>s.matches.filter(m=>m.set===i+1).map((m,j)=>overviewRow(m,`${i+1}세트 ${j+1}경기`))).join(''),aces=s.aces.map((m,i)=>overviewRow(m,`에이스${s.aces.length>1?' '+(i+1):''}`)).join('');return `<section class="panel overview"><div class="overview-head"><div><p class="eyebrow">LIVE MATCH BOARD</p><h2>경기 진행 현황</h2></div><span>대진과 승패를 한눈에 확인해.</span></div><div class="live-set-scores">${scores}</div><div class="overview-list"><div class="overview-label"><span>경기</span><span>맵</span><span>${esc(s.teamA)}</span><span></span><span>${esc(s.teamB)}</span><span>승리팀</span></div>${rows}${aces}</div></section>`}
function settlementData(){let x=s.settlement,totalPeople=s.playersA.length+s.playersB.length,entryTotal=Number(x.entryPerPerson||0)*totalPeople,personalFunding=players().reduce((sum,p)=>sum+Number(x.playerFunding?.[p.id]||0),0),commonFunding=Number(x.mainFunding||0),main=commonFunding+personalFunding,pool=x.mode==='main'?main:x.mode==='entry'?entryTotal:main+entryTotal,wr=Math.max(0,Number(x.winRatio||0)),lr=Math.max(0,Number(x.loseRatio||0)),sum=wr+lr||1,winner=x.winner,loser=winner==='A'?'B':winner==='B'?'A':'',winTotal=pool*wr/sum,loseTotal=pool*lr/sum,winCount=winner==='A'?s.playersA.length:winner==='B'?s.playersB.length:0,loseCount=loser==='A'?s.playersA.length:loser==='B'?s.playersB.length:0;return{pool,entryTotal,main,commonFunding,personalFunding,winner,loser,winTotal,loseTotal,winCount,loseCount}}
