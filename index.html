const APP_VERSION='2.6.0',KEY='star-match-manager-v1',races={P:'프로토스',T:'테란',Z:'저그',R:'랜덤'},tiers=['갓','킹','잭','조커','스페이드','0티어','1티어','2티어','3티어','4티어','5티어','6티어','7티어','8티어','유스'],defaultRoulette=()=>({type:'map',maps:'투혼\n폴리포이드\n실피드\n라데온',playerId:'',result:'',note:'',history:[]}),fresh=()=>({title:'오늘의 CK',mode:'CK',teamA:'A팀',teamB:'B팀',playersA:[],playersB:[],matches:[],setGames:[1],aces:[],winnerEnd:'elimination',winnerFixed:7,activeTab:'match',roulette:defaultRoulette(),settlement:{mode:'main',mainFunding:0,entryPerPerson:0,winRatio:6,loseRatio:4,winner:'',playerFunding:{}}});let s;try{s=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{s=fresh()}s.setGames=s.setGames||[Math.max(1,s.matches?.length||1)];s.matches=(s.matches||[]).map(m=>({...m,set:m.set||1}));s.aces=s.aces||[];s.winnerEnd=s.winnerEnd||'elimination';s.winnerFixed=s.winnerFixed||7;s.activeTab=s.activeTab||'match';s.roulette={...defaultRoulette(),...(s.roulette||{})};s.roulette.history=s.roulette.history||[];s.settlement={mode:'main',mainFunding:0,entryPerPerson:0,winRatio:6,loseRatio:4,winner:'',playerFunding:{},...(s.settlement||{})};s.settlement.playerFunding=s.settlement.playerFunding||{};const id=()=>Math.random().toString(36).slice(2,10),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),raceOpts=v=>Object.entries(races).map(([k,n])=>`<option value="${k}" ${k===v?'selected':''}>${n}</option>`).join(''),subRaceOpts=v=>'<option value="">부종 선택</option>'+['P','T','Z'].map(k=>`<option value="${k}" ${k===v?'selected':''}>${races[k]}</option>`).join(''),tierOpts=v=>'<option value="">티어 선택</option>'+tiers.map(t=>`<option value="${t}" ${t===v?'selected':''}>${t}</option>`).join(''),random=()=>['랜능크','빨무'].includes(s.mode),newMatch=set=>({id:id(),set,map:'',a:'',b:'',raceA:random()?'R':'P',raceB:random()?'R':'P',winner:''}),syncSets=()=>{if(s.mode==='위너스'){let count=s.winnerEnd==='elimination'?Math.max(1,s.playersA.length+s.playersB.length-1):s.winnerFixed;s.setGames=s.setGames.map(()=>count)}s.setGames.forEach((count,i)=>{let set=i+1,ms=s.matches.filter(m=>m.set===set);while(ms.length<count){let m=newMatch(set);s.matches.push(m);ms.push(m)}if(ms.length>count){let remove=new Set(ms.slice(count).map(m=>m.id));s.matches=s.matches.filter(m=>!remove.has(m.id))}})},setResult=setNo=>{let ms=s.matches.filter(m=>m.set===setNo),a=ms.filter(m=>m.winner==='A').length,b=ms.filter(m=>m.winner==='B').length;if(s.mode==='위너스'&&s.winnerEnd==='elimination'){let lostA=new Set(ms.filter(m=>m.winner==='B').map(m=>m.a).filter(Boolean)),lostB=new Set(ms.filter(m=>m.winner==='A').map(m=>m.b).filter(Boolean));if(s.playersA.length&&lostA.size>=s.playersA.length)return{a,b,winner:'B',done:true};if(s.playersB.length&&lostB.size>=s.playersB.length)return{a,b,winner:'A',done:true};return{a,b,winner:'',done:false}}let done=ms.length===s.setGames[setNo-1]&&ms.every(m=>m.winner),winner=done&&a!==b?(a>b?'A':'B'):'';return{a,b,winner,done}},save=()=>{syncSets();localStorage.setItem(KEY,JSON.stringify(s));render()},players=()=>[...s.playersA,...s.playersB];syncSets();
function playerPanel(side){let ps=s['players'+side],team=s['team'+side];return `<section class="panel team"><input class="team-name" data-act="team" data-side="${side}" value="${esc(team)}"><div class="player-form"><input id="name${side}" placeholder="선수 이름"><select id="tier${side}">${tierOpts('')}</select><select id="race${side}">${raceOpts('P')}</select><select id="subrace${side}">${subRaceOpts('')}</select><button class="primary" data-act="add-player" data-side="${side}">선수 추가</button></div><div class="roster">${ps.length?ps.map(p=>`<div class="player"><span class="chip ${p.race}">${p.race}</span><strong>${esc(p.name)}</strong><span>${esc(p.tier||'티어 미입력')} · 본 ${p.race}${p.subrace?' / 부 '+p.subrace:''}</span><button class="x" data-act="del-player" data-side="${side}" data-id="${p.id}">×</button></div>`).join(''):'<p class="empty">등록된 선수가 없어</p>'}</div></section>`}
function matchRow(m,i,ace=false){let earlier=ace?[]:s.matches.filter(x=>x.set===m.set).slice(0,i),lostA=new Set(earlier.filter(x=>x.winner==='B').map(x=>x.a)),lostB=new Set(earlier.filter(x=>x.winner==='A').map(x=>x.b)),pa=s.playersA.map(p=>`<option value="${p.id}" ${p.id===m.a?'selected':''} ${s.mode==='위너스'&&lostA.has(p.id)&&p.id!==m.a?'disabled':''}>${esc(p.name)}${p.tier?' · '+esc(p.tier):''}${s.mode==='위너스'&&lostA.has(p.id)?' · 탈락':''}</option>`).join(''),pb=s.playersB.map(p=>`<option value="${p.id}" ${p.id===m.b?'selected':''} ${s.mode==='위너스'&&lostB.has(p.id)&&p.id!==m.b?'disabled':''}>${esc(p.name)}${p.tier?' · '+esc(p.tier):''}${s.mode==='위너스'&&lostB.has(p.id)?' · 탈락':''}</option>`).join('');return `<article class="match panel ${m.winner?'done':''} ${!ace&&s.setGames[m.set-1]>=3&&i===s.setGames[m.set-1]-1?'ace-match':''}" data-id="${m.id}" data-ace="${ace}"><div class="num">${ace||(!ace&&s.setGames[m.set-1]>=3&&i===s.setGames[m.set-1]-1)?'ACE':i+1}</div><div class="map"><input data-field="map" placeholder="맵 이름" value="${esc(m.map)}"></div><div class="fighter ${m.winner==='A'?'win':''}"><select data-field="a"><option value="">${esc(s.teamA)} 선수 선택</option>${pa}</select><select data-field="raceA">${raceOpts(m.raceA)}</select><button data-act="winner" data-side="A">${m.winner==='A'?'승리 ✓':'승리'}</button></div><span class="vs">VS</span><div class="fighter ${m.winner==='B'?'win':''}"><select data-field="b"><option value="">${esc(s.teamB)} 선수 선택</option>${pb}</select><select data-field="raceB">${raceOpts(m.raceB)}</select><button data-act="winner" data-side="B">${m.winner==='B'?'승리 ✓':'승리'}</button></div>${ace?'<button class="x" data-act="del-ace">×</button>':'<span></span>'}</article>`}
function setSection(setNo){let ms=s.matches.filter(m=>m.set===setNo),result=setResult(setNo),winner=result.winner==='A'?s.teamA:result.winner==='B'?s.teamB:'';return `<section class="set-block"><div class="set-head"><div><p class="eyebrow">SET ${setNo}</p><h3>${setNo}세트 ${winner?`· <span class="set-winner">${esc(winner)} 승리</span>`:''}</h3></div><div class="set-controls">${s.mode==='위너스'&&s.winnerEnd==='elimination'?'<span class="empty">전원 탈락까지</span>':`<label>경기 수<select data-act="set-games" data-set="${setNo}">${[1,3,5,7,9,11,13,15].map(n=>`<option value="${n}" ${n===s.setGames[setNo-1]?'selected':''}>${n}경기${n>=3?' · ACE 포함':''}</option>`).join('')}</select></label>`}${s.setGames.length>1?`<button class="danger" data-act="del-set" data-set="${setNo}">세트 삭제</button>`:''}</div><div class="set-score"><strong>${result.a}</strong><span>:</span><strong>${result.b}</strong></div></div><div class="matches">${ms.map((m,i)=>matchRow(m,i)).join('')}</div></section>`}
function aceSection(){return s.aces.length?`<section class="set-block ace-block"><div class="set-head"><div><p class="eyebrow">ACE DECIDER</p><h3>에이스 결정전</h3></div></div><div class="matches">${s.aces.map((m,i)=>matchRow(m,i,true)).join('')}</div></section>`:''}
const playerName=id=>players().find(p=>p.id===id)?.name||'미정';
function overviewRow(m,label,current=false){let status=m.winner==='A'?s.teamA:m.winner==='B'?s.teamB:current?'진행 중':'대기';return `<div class="overview-row ${m.winner?'finished':current?'in-progress':''}" data-match-id="${m.id}"><strong>${label}</strong><span class="overview-map" data-overview-map="${m.id}">${esc(m.map||'맵 미정')}</span><span>${esc(playerName(m.a))} <small>${m.raceA}</small></span><b>VS</b><span>${esc(playerName(m.b))} <small>${m.raceB}</small></span><em>${esc(status)}</em></div>`}
function overviewPanel(){let results=s.setGames.map((_,i)=>setResult(i+1)),current=results.findIndex(r=>!r.done),scores=results.map((r,i)=>`<div class="live-set ${r.done?'done':i===current?'current':''}"><span>${i+1}세트</span><strong>${r.a} : ${r.b}</strong>${r.winner?`<small>${esc(r.winner==='A'?s.teamA:s.teamB)} 승</small>`:''}</div>`).join(''),regular=s.setGames.flatMap((_,i)=>s.matches.filter(m=>m.set===i+1)),ordered=[...regular,...s.aces],currentMatch=ordered.find((m,i)=>!m.winner&&i>0&&ordered[i-1].winner)?.id||'',rows=s.setGames.flatMap((_,i)=>s.matches.filter(m=>m.set===i+1).map((m,j)=>overviewRow(m,s.setGames[i]>=3&&j===s.setGames[i]-1?`${i+1}세트 ACE`:`${i+1}세트 ${j+1}경기`,m.id===currentMatch))).join(''),aces=s.aces.map((m,i)=>overviewRow(m,`에이스${s.aces.length>1?' '+(i+1):''}`,m.id===currentMatch)).join('');return `<section class="panel overview"><div class="overview-head"><div><p class="eyebrow">LIVE MATCH BOARD</p><h2>경기 진행 현황</h2></div><span>대진과 승패를 한눈에 확인해.</span></div><div class="live-set-scores">${scores}</div><div class="overview-list"><div class="overview-label"><span>경기</span><span>맵</span><span>${esc(s.teamA)}</span><span></span><span>${esc(s.teamB)}</span><span>상태</span></div>${rows}${aces}</div></section>`}
function settlementData(){let x=s.settlement,totalPeople=s.playersA.length+s.playersB.length,entryTotal=Number(x.entryPerPerson||0)*totalPeople,personalFunding=players().reduce((sum,p)=>sum+Number(x.playerFunding?.[p.id]||0),0),commonFunding=Number(x.mainFunding||0),main=commonFunding+personalFunding,pool=x.mode==='main'?main:x.mode==='entry'?entryTotal:main+entryTotal,wr=Math.max(0,Number(x.winRatio||0)),lr=Math.max(0,Number(x.loseRatio||0)),sum=wr+lr||1,winner=x.winner,loser=winner==='A'?'B':winner==='B'?'A':'',winTotal=pool*wr/sum,loseTotal=pool*lr/sum,winCount=winner==='A'?s.playersA.length:winner==='B'?s.playersB.length:0,loseCount=loser==='A'?s.playersA.length:loser==='B'?s.playersB.length:0;return{pool,entryTotal,main,commonFunding,personalFunding,winner,loser,winTotal,loseTotal,winCount,loseCount}}
const stars=n=>Number(n||0).toLocaleString('ko-KR',{maximumFractionDigits:2});
function settlementResult(){let d=settlementData();if(!d.winner)return`<div class="settle-empty">정산할 승리팀을 선택해줘.<br><small>현재 메인펀딩 합계 ${stars(d.main)}개 · 입장료 ${stars(d.entryTotal)}개</small></div>`;let wn=d.winner==='A'?s.teamA:s.teamB,ln=d.loser==='A'?s.teamA:s.teamB;return `<div class="settle-summary"><div><span>정산 총액</span><strong>${stars(d.pool)}개</strong></div><div class="win-pay"><span>${esc(wn)} · 승리팀</span><strong>${stars(d.winTotal)}개</strong><small>1인당 ${d.winCount?stars(d.winTotal/d.winCount):0}개 · ${d.winCount}명</small></div><div><span>${esc(ln)} · 패배팀</span><strong>${stars(d.loseTotal)}개</strong><small>1인당 ${d.loseCount?stars(d.loseTotal/d.loseCount):0}개 · ${d.loseCount}명</small></div></div><p class="settle-detail">메인펀딩 ${stars(d.main)}개 (공용 ${stars(d.commonFunding)} + 선수별 ${stars(d.personalFunding)}) · 입장료 총액 ${stars(d.entryTotal)}개</p>`}
function fundingRows(){return `<div class="funding-teams"><div><h3>${esc(s.teamA)}</h3>${s.playersA.map(p=>`<label><span>${esc(p.name)} <small>${esc(p.tier||'')}</small></span><input type="number" min="0" data-player-funding="${p.id}" value="${s.settlement.playerFunding[p.id]||0}"></label>`).join('')||'<p class="empty">등록 선수가 없어</p>'}</div><div><h3>${esc(s.teamB)}</h3>${s.playersB.map(p=>`<label><span>${esc(p.name)} <small>${esc(p.tier||'')}</small></span><input type="number" min="0" data-player-funding="${p.id}" value="${s.settlement.playerFunding[p.id]||0}"></label>`).join('')||'<p class="empty">등록 선수가 없어</p>'}</div></div>`}
function settlementPanel(){let x=s.settlement;return `<section class="panel settlement"><div class="settle-title"><div><p class="eyebrow">STAR BALLOON SETTLEMENT</p><h2>별풍선 정산</h2></div><span>등록 선수 ${s.playersA.length+s.playersB.length}명 기준</span></div><div class="settle-form"><label>정산 방식<select data-act="settle-mode"><option value="main" ${x.mode==='main'?'selected':''}>메인펀딩 비율 정산</option><option value="entry" ${x.mode==='entry'?'selected':''}>입장료 비율 정산</option><option value="combined" ${x.mode==='combined'?'selected':''}>메펀 + 입장료 비율 정산</option></select></label><label>공용 메인펀딩<input type="number" min="0" data-settle="mainFunding" value="${x.mainFunding}"></label><label>1인당 입장료<input type="number" min="0" data-settle="entryPerPerson" value="${x.entryPerPerson}"></label><label>승리팀 비율<input type="number" min="0" data-settle="winRatio" value="${x.winRatio}"></label><label>패배팀 비율<input type="number" min="0" data-settle="loseRatio" value="${x.loseRatio}"></label><label>정산 승리팀<select data-act="settle-winner"><option value="">선택</option><option value="A" ${x.winner==='A'?'selected':''}>${esc(s.teamA)}</option><option value="B" ${x.winner==='B'?'selected':''}>${esc(s.teamB)}</option></select></label></div><div class="funding-title"><h3>선수별 펀딩</h3><span>양 팀 선수 펀딩을 전부 합산해 비율 정산해.</span></div>${fundingRows()}<div id="settlement-result">${settlementResult()}</div></section>`}
function render(){let setWins={A:0,B:0};s.setGames.forEach((_,i)=>{let r=setResult(i+1);if(r.winner)setWins[r.winner]++});let modeText=s.mode==='부종리그'?'선수 등록 때 저장한 부종이 대진에 자동 적용돼.':s.mode==='위너스'?'승자는 다음 경기에 자동으로 남고, 패자는 탈락 처리돼.':random()?'기본은 랜덤이지만 저티어 선수는 경기별 지정 종족으로 바꿀 수 있어.':'선수 본종이 자동 입력되고 경기별로 부종을 선택할 수 있어.',winnerSettings=s.mode==='위너스'?`<div class="winner-settings"><label>위너스 종료<select data-act="winner-end"><option value="elimination" ${s.winnerEnd==='elimination'?'selected':''}>한 팀 전원 탈락</option><option value="fixed" ${s.winnerEnd==='fixed'?'selected':''}>정해진 경기 수</option></select></label>${s.winnerEnd==='fixed'?`<label>경기 수<select data-act="winner-fixed">${[1,3,5,7,9,11,13,15].map(n=>`<option value="${n}" ${n===s.winnerFixed?'selected':''}>${n}경기</option>`).join('')}</select></label>`:''}</div>`:'';document.querySelector('#app').innerHTML=`<header class="head"><div><p class="eyebrow">HARINA STAR MATCH ROOM</p><h1>하리나 매치룸</h1><p class="sub">대진 편성부터 출전 종족과 세트 승패까지 한 화면에서 관리해.</p></div><div class="actions"><button class="secondary" data-act="fullscreen">전체화면</button><button class="secondary" data-act="export">백업 저장</button><button class="secondary" data-act="import">백업 불러오기</button><input id="file" type="file" accept="application/json" hidden><button class="danger" data-act="reset">전체 초기화</button></div></header><nav class="app-tabs"><button class="${s.activeTab==='match'?'active':''}" data-act="tab" data-tab="match">대진 운영</button><button class="${s.activeTab==='settlement'?'active':''}" data-act="tab" data-tab="settlement">별풍 정산</button></nav><div class="tab-view" style="display:${s.activeTab==='match'?'block':'none'}"><section class="panel settings"><label>대회·방송 제목<input data-act="title" value="${esc(s.title)}"></label><label>경기 방식<select data-act="mode">${['CK','PL','부종리그','위너스','랜능크','빨무'].map(x=>`<option ${x===s.mode?'selected':''}>${x}</option>`).join('')}</select></label><div class="note"><b>${s.mode}</b><span>${modeText}</span></div>${winnerSettings}</ document.addEventListener('input',e=>{let t=e.target;if(t.dataset.act==='title'){s.title=t.value;localStorage.setItem(KEY,JSON.stringify(s))}if(t.dataset.act==='team'){s['team'+t.dataset.side]=t.value;localStorage.setItem(KEY,JSON.stringify(s))}if(t.dataset.settle){s.settlement[t.dataset.settle]=Number(t.value);localStorage.setItem(KEY,JSON.stringify(s));let result=document.querySelector('#settlement-result');if(result)result.innerHTML=settlementResult();return}if(t.dataset.playerFunding){s.settlement.playerFunding[t.dataset.playerFunding]=Number(t.value);localStorage.setItem(KEY,JSON.stringify(s));let result=document.querySelector('#settlement-result');if(result)result.innerHTML=settlementResult();return}if(t.closest('.match')&&t.dataset.field){let ace=t.closest('.match').dataset.ace==='true',pool=ace?s.aces:s.matches,m=pool.find(x=>x.id===t.closest('.match').dataset.id),f=t.dataset.field;m[f]=t.value;if(f==='map'){localStorage.setItem(KEY,JSON.stringify(s));let mapView=document.querySelector(`[data-overview-map="${m.id}"]`);if(mapView)mapView.textContent=t.value||'맵 미정';return}if(f==='a'||f==='b'){let p=players().find(x=>x.id===t.value),picked=random()?'R':s.mode==='부종리그'?(p?.subrace||p?.race||'P'):(p?.race||'P');m[f==='a'?'raceA':'raceB']=picked}save()}});document.addEventListener('change',e=>{let t=e.target;if(t.dataset.act==='mode'){s.mode=t.value;save()}if(t.dataset.act==='winner-end'){s.winnerEnd=t.value;save()}if(t.dataset.act==='winner-fixed'){s.winnerFixed=Number(t.value);save()}if(t.dataset.act==='settle-mode'){s.settlement.mode=t.value;save()}if(t.dataset.act==='settle-winner'){s.settlement.winner=t.value;save()}if(t.dataset.act==='set-games'){s.setGames[Number(t.dataset.set)-1]=Number(t.value);save()}if(t.id==='file'){let f=t.files[0];if(f)f.text().then(x=>{try{s=JSON.parse(x);s.setGames=s.setGames||[Math.max(1,s.matches?.length||1)];s.matches=(s.matches||[]).map(m=>({...m,set:m.set||1}));s.aces=s.aces||[];s.winnerEnd=s.winnerEnd||'elimination';s.winner body:before{display:block;content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:radial-gradient(circle,#fff 0 1px,transparent 1.7px),radial-gradient(circle,#e8c9ff 0 1px,transparent 1.8px);background-size:83px 83px,127px 127px;background-position:12px 18px,44px 61px;opacity:.22;animation:starDrift 18s linear infinite}
body:after{content:'';position:fixed;inset:-30%;z-index:-1;pointer-events:none;background:conic-gradient(from 180deg,transparent,#e7b7ff08,transparent 24%,#ffb6d908,transparent 48%);animation:auraSpin 28s linear infinite}
@keyframes starDrift{50%{opacity:.38;transform:translateY(-8px)}100%{background-position:12px 101px,44px 188px}}
@keyframes auraSpin{to{transform:rotate(360deg)}}
.head{position:relative;padding:18px 20px;border:1px solid #ffffff12;border-radius:18px;background:linear-gradient(125deg,#25162dcb,#17101fbd 52%,#2b1726b8);box-shadow:0 18px 55px #0007,0 0 35px #c58bff12 inset;overflow:hidden}
.head:after{content:'';position:absolute;top:-70%;left:-15%;width:35%;height:240%;background:linear-gradient(90deg,transparent,#ffffff16,transparent);transform:rotate(20deg);animation:headerShine 8s ease-in-out infinite}
@keyframes headerShine{0%,70%{left:-35%}100%{left:125%}}
h1{background:linear-gradient(90deg,#fff,#ead7ff 38%,#ffbddc 72%,#fff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 28px #d6a4ff36}.eyebrow{color:#e5b9ff}.sub{color:#c6b7ca}
.panel,.set-block{border-color:#493852;background:linear-gradient(145deg,#1d1524e8,#120d18e8);box-shadow:0 12px 34px #0005,0 0 0 1px #ffffff08 inset,0 0 24px #bd82e808;backdrop-filter:blur(14px)}
.panel:hover{border-color:#644b70;box-shadow:0 14px 38px #0006,0 0 0 1px #ffffff0d inset,0 0 28px #bd82e810}
.app-tabs{padding:6px;border-color:#493852;background:#120c18d9;box-shadow:0 10px 30px #0005;backdrop-filter:blur(14px)}
.app-tabs button{position:relative;min-height:42px;border-radius:9px;color:#ac9bb2}.app-tabs button.active{color:#1b1020;background:linear-gradient(135deg,#d6b9ff,#f3b3d2);box-shadow:0 5px 20px #d18be73b}.app-tabs button.active:after{content:'✦';margin-left:7px;font-size:10px}
button{border-color:#ffffff0b}.primary{color:#201225;background:linear-gradient(135deg,#d5b6ff,#f1a8cd);box-shadow:0 7px 22px #d78ee334}.primary:hover{transform:translateY(-1px);background:linear-gradient(135deg,#e1caff,#ffb6d8);box-shadow:0 9px 28px #dc91e84a}.secondary{border-color:#51405a;background:linear-gradient(145deg,#251a2d,#19121f);color:#eadff0}.secondary:hover{border-color:#826692;color:#fff}.danger{background:#27151f;border-color:#63354b;color:#ffb4d3}
input,select,.roulette-controls textarea{border-color:#44354c;background:linear-gradient(145deg,#130e18,#0f0b14);color:#fffaff;box-shadow:0 1px 0 #ffffff09 inset}input:focus,select:focus,.roulette-controls textarea:focus{border-color:#d2a4f5;box-shadow:0 0 0 3px #d6a0f01b,0 0 18px #cf8fe516}
.team-name{color:#f9edff;border-image:linear-gradient(90deg,#ba8de0,#ff9fc900) 1}.chip{box-shadow:0 3px 12px #0005,0 0 0 1px #ffffff16 inset}.player{border:1px solid #382b40;background:linear-gradient(135deg,#15101b,#1d1422)}
.score{position:relative;overflow:hidden;border-color:#6e5279;background:linear-gradient(110deg,#2b1b39,#19121f 48%,#351928);box-shadow:0 12px 36px #0006,0 0 30px #bd78dd16 inset}.score strong{color:#f5ddff;text-shadow:0 0 18px #d394ff55}.score:after{content:'✦';position:absolute;left:50%;top:50%;color:#f2c5e1;opacity:.3;transform:translate(-50%,-50%);font-size:34px}
.set-score,.live-set{background:linear-gradient(145deg,#24182c,#17111d)}.live-set.current,.overview-row.in-progress{border-color:#c59ce8;background:linear-gradient(135deg,#281b31,#321a2a);box-shadow:0 0 18px #c78ce528}.live-set.done,.overview-row.finished em{border-color:#5d8d78;background:#18271f}
.overview-row{border-color:#3c3043;background:linear-gradient(135deg,#151019,#1a121e)}.overview-row:hover{border-color:#66506f;background:#211629}.overview-row.in-progress em{background:linear-gradient(135deg,#d5b6ff,#f0a8cb);color:#201225;box-shadow:0 0 17px #dd9be54a}
.fighter.win{border-color:#9ed9bd;background:linear-gradient(135deg,#182a22,#20342a);box-shadow:0 0 18px #76d6aa1f}.fighter.win button{background:linear-gradient(135deg,#98e0bf,#72cfa8)}
.settlement{border-color:#5b4265}.funding-teams>div,.settle-summary>div,.roulette-result,.history-row{border-color:#403047;background:linear-gradient(145deg,#17101d,#211526)}
.roulette-card{position:relative;overflow:hidden}.roulette-card:before{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 12% 4%,#e7beff16,transparent 24%),radial-gradient(circle at 91% 92%,#ff9fc914,transparent 25%)}
.roulette-wheel{border:9px solid #f0d9ff;box-shadow:0 18px 50px #0009,0 0 0 5px #6c477a,0 0 36px #cf8ef067,0 0 75px #d88bc228;animation:wheelGlow 2.8s ease-in-out infinite}.roulette-wheel:before{content:'';position:absolute;inset:7px;border:1px solid #ffffff55;border-radius:50%;box-shadow:0 0 20px #fff2 inset;pointer-events:none}.roulette-wheel:after{content:'';position:absolute;inset:-9px;border-radius:50%;background:conic-gradient(transparent 0 10%,#fff8 12%,transparent 14% 36%,#ffc9e788 38%,transparent 40% 100%);filter:blur(1px);pointer-events:none}.wheel-pointer{border-top-color:#ffd9ed;filter:drop-shadow(0 0 7px #ffb4dc) drop-shadow(0 4px 5px #000)}.wheel-center{border-color:#d7b9e7;background:radial-gradient(circle at 35% 28%,#3b2744,#17101d 68%);box-shadow:0 7px 24px #0009,0 0 18px #d99ee536 inset}.wheel-center strong{color:#fff;text-shadow:0 0 12px #e4b1ff}.wheel-label{text-shadow:0 2px 5px #000,0 0 7px #fff5}
@keyframes wheelGlow{50%{box-shadow:0 18px 50px #0009,0 0 0 5px #7e568d,0 0 48px #d89df47a,0 0 90px #eb9dcc35}}
.roulette-result strong{background:linear-gradient(90deg,#e7ceff,#ffb4d5);-webkit-background-clip:text;background-clip:text;color:transparent}.spin-button{position:relative;overflow:hidden}.spin-button:after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,#fff7 50%,transparent 65%);transform:translateX(-130%);animation:buttonSpark 3.4s ease-in-out infinite}@keyframes buttonSpark{60%,100%{transform:translateX(130%)}}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-track{background:#100b15}::-webkit-scrollbar-thumb{border:2px solid #100b15;border-radius:10px;background:linear-gradient(#b88ee0,#d27eaa)}
@media(max-width:700px){.head{padding:15px}.panel:hover{transform:none}}
</style>`);

function placeBrandArt(){let head=document.querySelector('.head'),actions=head?.querySelector('.actions');if(actions&&!head.querySelector('.brand-logo'))actions.insertAdjacentHTML('beforebegin','<img class="brand-logo" src="'+HARINA_LOGO+'" alt="HARINA">');if(!document.querySelector('.dorangi-mascot'))document.body.insertAdjacentHTML('beforeend','<img class="dorangi-mascot" src="'+DORANGI_MASCOT+'" alt="" aria-hidden="true">')}
new MutationObserver(placeBrandArt).observe(document.querySelector('#app'),{childList:true,subtree:true});placeBrandArt();
document.head.insertAdjacentHTML('beforeend','<style>.brand-logo{flex:0 1 270px;width:min(270px,22vw);height:auto;object-fit:contain;filter:drop-shadow(0 0 12px #c68df055) drop-shadow(0 6px 13px #0008);transition:transform .25s,filter .25s}.brand-logo:hover{transform:scale(1.025);filter:drop-shadow(0 0 18px #dfa9ff77) drop-shadow(0 7px 15px #0009)}.dorangi-mascot{position:fixed;z-index:12;right:12px;bottom:8px;width:150px;height:auto;pointer-events:none;filter:drop-shadow(0 8px 18px #0008) drop-shadow(0 0 12px #ff9fc933);animation:mascotFloat 4s ease-in-out infinite}@keyframes mascotFloat{50%{transform:translateY(-7px)}}@media(max-width:1100px){.brand-logo{width:190px}.dorangi-mascot{width:115px;opacity:.88}}@media(max-width:760px){.brand-logo{width:160px;align-self:center}.head{display:grid;grid-template-columns:1fr auto}.head>.actions{grid-column:1/-1}.dorangi-mascot{width:86px;right:4px;bottom:4px;opacity:.55}}@media(max-width:480px){.brand-logo{width:125px}.dorangi-mascot{display:none}}</style>');
setInterval(async()=>{try{const html=await fetch('./index.html?t='+Date.now(),{cache:'no-store'}).then(r=>r.text()),latest=html.match(/APP_VERSION='([^']+)'/)?.[1];if(latest&&latest!==APP_VERSION){location.reload()}}catch{}},60000);
