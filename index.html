/* v4.2.0 · direct round count and separate team entry */
let partyRoundInputTimer;
document.addEventListener('input',e=>{
  if(e.target.dataset.partyRoundCount===undefined)return;
  clearTimeout(partyRoundInputTimer);
  const input=e.target;
  partyRoundInputTimer=setTimeout(()=>{
    if(!document.body.contains(input)||input.value==='')return;
    const count=Math.max(1,Math.min(30,Math.floor(Number(input.value)||1)));
    if(count===s.partyScore.rounds)return;
    s.partyScore.rounds=count;save();
  },350);
});
document.addEventListener('change',e=>{
  if(e.target.dataset.partyRoundCount!==undefined){
    let count=Math.max(1,Math.min(30,Math.floor(Number(e.target.value)||1)));
    s.partyScore.rounds=count;save();
  }
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  if(e.target.id==='partyPlayerNameA'||e.target.id==='partyPlayerNameB'){
    e.preventDefault();
    document.querySelector('[data-party-team-add="'+(e.target.id.endsWith('A')?'A':'B')+'"]')?.click();
  }
});
document.addEventListener('click',e=>{
  let b=e.target.closest('[data-party-team-add]');if(!b)return;
  let team=b.dataset.partyTeamAdd,input=document.querySelector('#partyPlayerName'+team),name=input?.value.trim();if(!name)return;
  let p={id:id(),name,team};s.partyScore.players.push(p);s.partyScore.scores[p.id]=[];save();
});

async function loadSharedPlayerMaster(force=false){
  const res=await fetch(SHARED_PLAYER_MASTER_URL+(force?'?t='+Date.now():''),{cache:'no-store'});

  const payload=await res.json(),list=Array.isArray(payload.players)?payload.players:[];

    const label=p.tierLabel||(p.tier==='유스'?'베이비':p.tier||'미지정');

  });
  const order=(payload.tierOrder||[]).map(t=>t==='유스'?'베이비':t);

  TIER_DATA.splice(0,TIER_DATA.length,...rebuilt);
  Object.keys(PLAYER_DIRECTORY).forEach(k=>delete PLAYER_DIRECTORY[k]);
  list.filter(p=>p&&p.active!==false&&p.name).forEach(p=>{
    const meta={name:p.name,tier:p.tier||'',race:p.race||''};
    PLAYER_DIRECTORY[normalizePlayerDirectoryName(p.name)]=meta;
    (p.aliases||[]).forEach(a=>{if(a)PLAYER_DIRECTORY[normalizePlayerDirectoryName(a)]=meta});

}

.party-image-preview-actions{display:flex;justify-content:flex-end;gap:8px;padding:12px 14px}.party-image-preview-actions a{display:inline-flex;align-items:center;justify-content:center;padding:10px 14px;border-radius:9px;text-decoration:none}

</style>`);

<script id="integrated-update-manager">
(()=>{
const RELEASE_VERSION='5.16.6';
const VERSION_URL='./version.json';
const versionParts=v=>String(v||'0').split('.').map(n=>Number(n)||0);
const newer=(a,b)=>{const x=versionParts(a),y=versionParts(b);for(let i=0;i<Math.max(x.length,y.length);i++){if((x[i]||0)!==(y[i]||0))return (x[i]||0)>(y[i]||0)}return false};
async function applyIntegratedUpdate(version){
  const button=document.querySelector('[data-app-update]');
  if(button){button.disabled=true;button.textContent='업데이트 중…'}
  try{
    if('caches' in window){for(const key of await caches.keys())await caches.delete(key)}
    if('serviceWorker' in navigator){for(const reg of await navigator.serviceWorker.getRegistrations())await reg.unregister()}
  }catch{}
  const url=new URL(location.href);
  url.searchParams.set('update',version+'-'+Date.now());
  location.replace(url.toString());
}
async function checkIntegratedUpdate(){
  const button=document.querySelector('[data-app-update]');
  if(!button)return;
  button.disabled=true;button.textContent='확인 중…';
  try{
    const response=await fetch(VERSION_URL+'?t='+Date.now(),{cache:'no-store'});
    if(!response.ok)throw new Error('version check failed');
    const info=await response.json();
    if(newer(info.version,RELEASE_VERSION)){
      button.disabled=false;button.textContent='업데이트 v'+info.version;
      button.classList.remove('secondary');button.classList.add('primary');
      button.onclick=()=>applyIntegratedUpdate(info.version);
    }else{
      button.textContent='최신 버전';
      setTimeout(()=>{if(button.isConnected){button.disabled=false;button.textContent='업데이트 확인'}},1800);
    }
  }catch{
    button.disabled=false;button.textContent='다시 확인';
    alert('버전 확인에 실패했어. 인터넷 연결 후 다시 눌러줘.');
  }
}
function installUpdateControl(){
  const actions=document.querySelector('.head .actions');
  if(!actions)return;
  const badge=actions.querySelector('.app-version-badge');
  if(badge&&badge.textContent!=='v'+RELEASE_VERSION)badge.textContent='v'+RELEASE_VERSION;
  if(!actions.querySelector('[data-app-update]')){
    const button=document.createElement('button');
    button.type='button';button.className='secondary app-update-button';button.dataset.appUpdate='1';
    button.textContent='업데이트 확인';button.onclick=checkIntegratedUpdate;
    const fullscreen=actions.querySelector('[data-act="fullscreen"]');
    actions.insertBefore(button,fullscreen||actions.firstChild);
  }
}
installUpdateControl();
new MutationObserver(installUpdateControl).observe(document.getElementById('app'),{childList:true,subtree:true});
window.checkIntegratedUpdate=checkIntegratedUpdate;
})();
</script>
